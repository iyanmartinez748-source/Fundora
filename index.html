                  {pace.status==='fully-used' && (
                    <div style={{fontWeight:700, fontSize:'.82rem', color:'var(--status-warn-text)'}}>Budget fully used</div>
                  )}
                  {pace.status==='over-budget' && (
                    <div style={{fontWeight:700, fontSize:'.82rem', color:'var(--status-bad-text)'}}>No daily budget remaining</div>
                  )}
                  {pace.status==='completed' && (
                    <>
                      <div style={{fontWeight:700, fontSize:'.82rem'}}>Budget period completed</div>
                      {pace.categoryRemaining>0 && (
                        <div className="muted" style={{fontSize:'.78rem', marginTop:'.15rem'}}>{PESO(pace.categoryRemaining)} remaining</div>
                      )}
                    </>
                  )}
                  {pace.status==='invalid' && (
                    <div style={{fontWeight:700, fontSize:'.82rem', color:'var(--status-warn-text)'}}>Budget Pace needs to be updated.</div>
                  )}
                  {showShortageWarning && (
                    <div className="muted" style={{fontSize:'.74rem', marginTop:'.4rem', lineHeight:1.4, color:'var(--status-warn-text)'}}>
                      Your overall available balance is lower than this category&rsquo;s remaining plan.
                    </div>
                  )}
                </div>
              )}

              {b.kind==='spend' && (
                <button type="button" onClick={()=>openPaceModal(b)} style={{
                  display:'block', marginTop:'.6rem', background:'none', border:'none', padding:0,
                  color:'var(--brand)', fontWeight:700, fontSize:'.78rem', textAlign:'left'
                }}>
                  {(b.paceDays!=null || b.paceStartDate!=null) ? 'Edit Budget Pace' : 'Set Budget Pace'}
                </button>
              )}
            </div>
          );
        })}
      </div>

      <button type="button" className="btn-add-bucket" style={{marginTop:'.9rem'}} onClick={openModal}>
        <PlusIcon size={15}/> Add Bucket
      </button>

      <div className="card" style={{marginTop:'1.1rem', padding:'.95rem 1.15rem'}}>
        <div className="row between">
          <span style={{fontWeight:800}}>Total</span>
          <span className="tabular" style={{fontWeight:800, color:statusTone.ink}}>{totalPct}% &middot; {PESO(totalAmount)}</span>
        </div>
      </div>
    </div>

    {modalOpen && (
      <div className="modal-backdrop" onClick={closeModal}>
        <form className="modal-sheet" onClick={e=>e.stopPropagation()} onSubmit={submitAdd}>
          <div style={{width:36, height:4, borderRadius:99, background:'var(--app-border)', margin:'0 auto 1rem'}}/>
          <div style={{fontWeight:800, fontSize:'1.05rem', marginBottom:'1.1rem'}}>{editingId ? 'Edit Bucket' : 'Add Bucket'}</div>

          <label htmlFor="bucket-name" className="eyebrow" style={{display:'block', marginBottom:'.4rem'}}>Bucket Name</label>
          <input id="bucket-name" value={formName} onChange={e=>setFormName(e.target.value)} placeholder="e.g. Pets, Side Fund" maxLength={24}
            style={{width:'100%', padding:'.75rem .9rem', borderRadius:'var(--r-md)', border:'1px solid var(--app-border)', background:'var(--app-surface)', fontSize:'.9rem', color:'var(--app-ink)'}}/>

          {!editingId && (
            <>
              <label htmlFor="bucket-pct" className="eyebrow" style={{display:'block', marginTop:'1.05rem', marginBottom:'.4rem'}}>Percentage</label>
              <div className="row" style={{gap:'.4rem'}}>
                <input id="bucket-pct" className="pct-input" style={{width:'4.4rem'}} inputMode="numeric"
                  value={formPct} onChange={e=>setFormPct(e.target.value.replace(/[^0-9]/g,''))}/>
                <span className="muted" style={{fontWeight:700}}>%</span>
              </div>

              <div className="row between" style={{marginTop:'1.1rem'}}>
                <div>
                  <div style={{fontWeight:700, fontSize:'.88rem'}}>Protected</div>
                  <div className="faint" style={{fontSize:'.74rem'}}>Locks this bucket, like Savings</div>
                </div>
                <button type="button" role="switch" aria-checked={formProtected} className="switch" onClick={()=>setFormProtected(v=>!v)}>
                  <span className="switch-knob"/>
                </button>
              </div>
            </>
          )}

          <div className="row" style={{gap:'.6rem', marginTop:'1.4rem'}}>
            <button type="button" className="btn-ghost" style={{flex:1}} onClick={closeModal}>Cancel</button>
            <button type="submit" className="btn-primary" style={{flex:1.5}}>{editingId ? 'Save Changes' : 'Add Bucket'}</button>
          </div>
        </form>
      </div>
    )}

    {paceModalOpen && paceBucket && (
      <div className="modal-backdrop" onClick={closePaceModal}>
        {paceConfirmView==='restart' ? (
          <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
            <div style={{width:36, height:4, borderRadius:99, background:'var(--app-border)', margin:'0 auto 1rem'}}/>
            <div className="row" style={{gap:'.6rem'}}>
              <div className="icon-btn" style={{background:'var(--status-warn-bg)', color:'var(--status-warn-icon)', border:'none', width:34, height:34, flexShrink:0}}>
                <AlertTriangleIcon size={16}/>
              </div>
              <div style={{fontWeight:800, fontSize:'1rem'}}>Restart Budget Pace?</div>
            </div>
            <div className="muted" style={{fontSize:'.84rem', marginTop:'.9rem', lineHeight:1.5}}>
              This will restart the countdown from today. Your spending and remaining budget will not be reset.
            </div>
            <div className="row" style={{gap:'.6rem', marginTop:'1.3rem'}}>
              <button type="button" className="btn-ghost" style={{flex:1}} onClick={()=>setPaceConfirmView(null)}>Keep Current Pace</button>
              <button type="button" className="btn-primary" style={{flex:1}} onClick={confirmRestartPace}>Restart Pace</button>
            </div>
          </div>
        ) : paceConfirmView==='remove' ? (
          <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
            <div style={{width:36, height:4, borderRadius:99, background:'var(--app-border)', margin:'0 auto 1rem'}}/>
            <div className="row" style={{gap:'.6rem'}}>
              <div className="icon-btn" style={{background:'var(--status-bad-bg)', color:'var(--status-bad-icon)', border:'none', width:34, height:34, flexShrink:0}}>
                <TrashIcon size={16}/>
              </div>
              <div style={{fontWeight:800, fontSize:'1rem'}}>Remove Budget Pace?</div>
            </div>
            <div className="muted" style={{fontSize:'.84rem', marginTop:'.9rem', lineHeight:1.5}}>
              This removes the pacing guide only. Your budget, spending, and transactions will stay unchanged.
            </div>
            <div className="row" style={{gap:'.6rem', marginTop:'1.3rem'}}>
              <button type="button" className="btn-ghost" style={{flex:1}} onClick={()=>setPaceConfirmView(null)}>Keep Budget Pace</button>
              <button type="button" className="btn-primary" style={{flex:1, background:'var(--status-bad-icon)', boxShadow:'none'}} onClick={confirmRemovePace}>Remove Pace</button>
            </div>
          </div>
        ) : (
          <form className="modal-sheet" onClick={e=>e.stopPropagation()} onSubmit={saveBudgetPace}>
            <div style={{width:36, height:4, borderRadius:99, background:'var(--app-border)', margin:'0 auto 1rem'}}/>
            <div style={{fontWeight:800, fontSize:'1.05rem', marginBottom:'.3rem'}}>Budget Pace</div>
            <div className="muted" style={{fontSize:'.82rem', marginBottom:'1.1rem'}}>{paceBucket.name}</div>

            <label htmlFor="pace-days" className="eyebrow" style={{display:'block', marginBottom:'.4rem'}}>How many days should this budget last?</label>
            <div className="row" style={{gap:'.4rem'}}>
              <input id="pace-days" className="pct-input" style={{width:'5rem'}} inputMode="numeric"
                value={paceFormDays} onChange={e=>{ setPaceFormDays(e.target.value.replace(/[^0-9]/g,'')); setPaceError(''); }}/>
              <span className="muted" style={{fontWeight:700}}>days</span>
            </div>
            {paceError && (
              <div className="muted" style={{fontSize:'.78rem', marginTop:'.5rem', color:'var(--status-bad-text)', lineHeight:1.4}}>
                {paceError}
              </div>
            )}
            <div className="muted" style={{fontSize:'.78rem', marginTop:'.9rem', lineHeight:1.4}}>
              Fundora will adjust the suggested daily limit as your remaining budget changes.
            </div>

            {paceHasExisting && (
              <div className="row" style={{gap:'.6rem', marginTop:'1.1rem'}}>
                <button type="button" onClick={()=>setPaceConfirmView('restart')} style={{
                  flex:1, textAlign:'center', background:'none', border:'1px solid var(--app-border)', borderRadius:'var(--r-md)',
                  color:'var(--app-ink-soft)', fontWeight:700, fontSize:'.8rem', padding:'.55rem'
                }}>
                  Restart Pace
                </button>
                <button type="button" onClick={()=>setPaceConfirmView('remove')} style={{
                  flex:1, textAlign:'center', background:'none', border:'1px solid var(--app-border)', borderRadius:'var(--r-md)',
                  color:'var(--status-bad-text)', fontWeight:700, fontSize:'.8rem', padding:'.55rem'
                }}>
                  Remove Budget Pace
                </button>
              </div>
            )}

            <div className="row" style={{gap:'.6rem', marginTop:'1.2rem'}}>
              <button type="button" className="btn-ghost" style={{flex:1}} onClick={closePaceModal}>Cancel</button>
              <button type="submit" className="btn-primary" style={{flex:1.5}}>{paceHasExisting ? 'Save Changes' : 'Set Pace'}</button>
            </div>
          </form>
        )}
      </div>
    )}
    </>
  );
}

function AmountField({id, value, onChange}){
  return (
    <div className="card" style={{textAlign:'center'}}>
      <div className="eyebrow">Amount</div>
      <div className="row" style={{justifyContent:'center', alignItems:'baseline', gap:'.25rem', marginTop:'.3rem'}}>
        <span style={{fontFamily:'var(--font-display)', fontWeight:800, fontSize:'1.6rem'}}>&#8369;</span>
        <input id={id} value={value} onChange={e=>onChange(e.target.value.replace(/[^0-9.]/g,''))}
               inputMode="decimal" style={{
                 border:'none', outline:'none', fontFamily:'var(--font-display)', fontWeight:800,
                 fontSize:'2.2rem', width:'9ch', textAlign:'center', background:'transparent', color:'var(--app-ink)'
               }}/>
      </div>
    </div>
  );
}

const toNum = v => parseFloat(v) || 0;
const fmtSigned = n => n<0 ? '-'+PESO(Math.abs(n)) : PESO(n);

function TransactionsPage({income, setIncome, buckets, setBuckets, transactions, setTransactions}){
  const [tab, setTab] = useState('expense');
  const [saved, setSaved] = useState(false);

  const [expenseAmount, setExpenseAmount] = useState('');
  const [note, setNote] = useState('');
  const [category, setCategory] = useState('living');
  const [date, setDate] = useState(()=> new Date().toISOString().slice(0,10));

  const [incomeAmount, setIncomeAmount] = useState('');
  const [incomeSource, setIncomeSource] = useState('salary');

  const [transferAmount, setTransferAmount] = useState('');
  const [fromBucket, setFromBucket] = useState('living');
  const [toBucket, setToBucket] = useState('wants');

  const liveBuckets = deriveBuckets(buckets, income);
  const lookup = Object.fromEntries(liveBuckets.map(b=>[b.id,b]));

  const tabs = [
    {id:'expense', label:'Expense', Icon:ArrowDownCircleIcon},
    {id:'income', label:'Income', Icon:ArrowUpCircleIcon},
    {id:'transfer', label:'Transfer', Icon:TransferIcon},
  ];
  const submitLabel = tab==='income' ? 'Add Income' : tab==='transfer' ? 'Transfer Money' : 'Save Transaction';

  const selectedCat = lookup[category] || null;
  const expenseNum = toNum(expenseAmount);
  const available = selectedCat ? selectedCat.available : 0;
  const afterExpense = available - expenseNum;
  const shortfall = expenseNum > available ? expenseNum - available : 0;
  const isProtectedCat = selectedCat && selectedCat.kind==='protect';
  const hasExpenseAmount = expenseNum > 0;

  const incomeNum = toNum(incomeAmount);

  const fromB = lookup[fromBucket];
  const toB = lookup[toBucket];
  const transferNum = toNum(transferAmount);
  const fromBal = fromB ? fromB.available : 0;
  const toBal = toB ? toB.available : 0;
  const transferShortfall = transferNum > fromBal ? transferNum - fromBal : 0;
  const fromIsProtected = fromB && fromB.kind==='protect';

  function onSave(e){
    e.preventDefault();
    if(tab==='expense'){
      if(!selectedCat || expenseNum<=0) return; // reject zero/invalid amounts, or no selected bucket
      setBuckets(bs=>bs.map(b=> b.id===category ? {...b, used: b.used + expenseNum} : b));
      setTransactions(prev=>[{
        id:'txn-'+Date.now(), type:'expense', amount:expenseNum, bucketId:category, note:note.trim(), date,
        // Frozen category identity for future historical Reports only — captured from the
        // already-resolved, already-validated live bucket, never from arbitrary input. Never
        // read by the current Activity Log, which continues to resolve bucketId live.
        bucketNameSnapshot: selectedCat.name, bucketKindSnapshot: selectedCat.kind,
      }, ...prev]);
      setExpenseAmount('');
      setNote('');
    } else if(tab==='income'){
      if(incomeNum<=0) return; // reject zero/invalid amounts
      setIncome(prev=>prev + incomeNum);
      setTransactions(prev=>[{
        id:'txn-'+Date.now(), type:'income', amount:incomeNum, source:incomeSource, date,
      }, ...prev]);
      setIncomeAmount('');
    }
    // Transfer intentionally does not mutate shared state yet — preview/demo only (see below).
    setSaved(true);
    setTimeout(()=>setSaved(false), 2200);
  }
  function selectFromBucket(id){
    setFromBucket(id);
    if(id===toBucket){ const alt = buckets.find(b=>b.id!==id); if(alt) setToBucket(alt.id); }
  }
  function selectToBucket(id){
    setToBucket(id);
    if(id===fromBucket){ const alt = buckets.find(b=>b.id!==id); if(alt) setFromBucket(alt.id); }
  }

  return (
    <div className="app-scroll">
      <TopBar/>
      <div className="page-head">
        <div className="page-title">Add Transaction</div>
        <div className="page-sub">Visual only &mdash; nothing is saved yet</div>
      </div>

      <div className="row" style={{gap:'.4rem', background:'var(--app-surface-2)', padding:'.3rem', borderRadius:'var(--r-pill)'}}>
        {tabs.map(t=>(
          <button key={t.id} type="button" onClick={()=>setTab(t.id)} className="row" style={{
            flex:1, justifyContent:'center', gap:'.35rem', padding:'.5rem .3rem', borderRadius:'var(--r-pill)',
            border:'none', fontWeight:700, fontSize:'.8rem',
            background: tab===t.id ? 'var(--app-surface)' : 'transparent',
            color: tab===t.id ? 'var(--app-ink)' : 'var(--app-ink-faint)',
            boxShadow: tab===t.id ? 'var(--shadow-sm)' : 'none',
          }}>
            <t.Icon size={16}/>{t.label}
          </button>
        ))}
      </div>

      <form onSubmit={onSave}>

        {tab==='expense' && (
          <>
            <div style={{marginTop:'1.1rem'}}>
              <AmountField id="expense-amount" value={expenseAmount} onChange={setExpenseAmount}/>
            </div>

            <label htmlFor="txn-note" className="eyebrow" style={{display:'block', marginTop:'1.1rem', marginBottom:'.4rem'}}>Note</label>
            <input id="txn-note" value={note} onChange={e=>setNote(e.target.value)} placeholder="What was this for?" style={{
              width:'100%', padding:'.8rem .9rem', borderRadius:'var(--r-md)', border:'1px solid var(--app-border)',
              background:'var(--app-surface)', fontSize:'.9rem', color:'var(--app-ink)'
            }}/>

            <div className="eyebrow" style={{marginTop:'1.1rem', marginBottom:'.4rem'}}>Category</div>
            <div className="row" style={{flexWrap:'wrap', gap:'.5rem'}}>
              {liveBuckets.map(b=>(
                <button type="button" key={b.id} className="chip row" style={{gap:'.32rem'}}
                        aria-pressed={category===b.id} onClick={()=>setCategory(b.id)}>
                  {b.name}
                  {b.kind==='protect' && <LockIcon size={11}/>}
                </button>
              ))}
            </div>

            <label htmlFor="txn-date" className="eyebrow" style={{display:'block', marginTop:'1.1rem', marginBottom:'.4rem'}}>Date</label>
            <div className="row" style={{gap:'.6rem', border:'1px solid var(--app-border)', background:'var(--app-surface)', borderRadius:'var(--r-md)', padding:'.7rem .9rem'}}>
              <CalendarIcon size={18} className="muted"/>
              <input id="txn-date" type="date" value={date} onChange={e=>setDate(e.target.value)} style={{

                      <div style={{fontWeight:800, fontSize:'.9rem', color:'var(--status-bad-text)'}}>&#9888; Not enough in {selectedCat.name}</div>

                    <div style={{marginTop:'.75rem', display:'grid', gap:'.35rem'}}>

                        <span className="muted" style={{fontSize:'.82rem'}}>Available</span>

                      <div className="row between">

                      </div>
                    </div>
                    <div className="muted" style={{fontSize:'.78rem', marginTop:'.7rem', lineHeight:1.4}}>

                    </div>

                ) : (
                  <div className="card">
                    <div className="row" style={{gap:'.6rem'}}>
                      <div className="bucket-icon" style={{background:selectedCat.color, width:32, height:32}}><selectedCat.Icon size={15}/></div>
                      <div style={{fontWeight:700, fontSize:'.92rem'}}>{selectedCat.name}</div>
                    </div>
                    <div className="row between" style={{marginTop:'.75rem'}}>
                      <span className="muted" style={{fontSize:'.82rem'}}>Available</span>
                      <span className="tabular" style={{fontWeight:700, fontSize:'.85rem'}}>{PESO(available)}</span>
                    </div>
                    <div className="row between" style={{marginTop:'.35rem'}}>
                      <span className="muted" style={{fontSize:'.82rem'}}>This Expense</span>
                      <span className="tabular" style={{fontWeight:700, fontSize:'.85rem'}}>{hasExpenseAmount ? `− ${PESO(expenseNum)}` : PESO(0)}</span>
                    </div>
                    <div className="row between" style={{marginTop:'.6rem', paddingTop:'.6rem', borderTop:'1px solid var(--app-border)'}}>
                      <span style={{fontWeight:800, fontSize:'.85rem'}}>After Transaction</span>
                      <span className="tabular" style={{fontWeight:800, fontSize:'.92rem', color: hasExpenseAmount ? 'var(--brand)' : 'var(--app-ink)'}}>

                      </span>
                    </div>
                  </div>
                )}

            )}
          </>
        )}

        {tab==='income' && (
          <>
            <div style={{marginTop:'1.1rem'}}>
              <AmountField id="income-amount" value={incomeAmount} onChange={setIncomeAmount}/>
            </div>

            <div className="eyebrow" style={{marginTop:'1.1rem', marginBottom:'.4rem'}}>Income Source</div>
            <div className="row" style={{flexWrap:'wrap', gap:'.5rem'}}>
              {INCOME_SOURCES.map(s=>(
                <button type="button" key={s.id} className="chip" aria-pressed={incomeSource===s.id} onClick={()=>setIncomeSource(s.id)}>
                  {s.label}
                </button>
              ))}
            </div>

            <label htmlFor="income-date" className="eyebrow" style={{display:'block', marginTop:'1.1rem', marginBottom:'.4rem'}}>Date</label>
            <div className="row" style={{gap:'.6rem', border:'1px solid var(--app-border)', background:'var(--app-surface)', borderRadius:'var(--r-md)', padding:'.7rem .9rem'}}>
              <CalendarIcon size={18} className="muted"/>
              <input id="income-date" type="date" value={date} onChange={e=>setDate(e.target.value)} style={{
                border:'none', outline:'none', background:'transparent', fontSize:'.88rem', color:'var(--app-ink)', flex:1
              }}/>
            </div>

            <div className="eyebrow" style={{marginTop:'1.1rem', marginBottom:'.6rem'}}>New Income</div>
            <div className="card" style={{textAlign:'center', background:'var(--brand-tint)', border:'1px solid transparent'}}>
              <div className="tabular" style={{fontFamily:'var(--font-display)', fontWeight:800, fontSize:'1.9rem', color:'var(--brand-strong)'}}>
                {PESO(incomeNum)}
              </div>
              <div style={{fontSize:'.8rem', color:'var(--brand)', marginTop:'.5rem', lineHeight:1.4}}>
                Your Money Plan will determine how this income is allocated.
              </div>
            </div>
          </>
        )}

        {tab==='transfer' && (
          <>
            <div className="eyebrow" style={{marginTop:'1.1rem', marginBottom:'.4rem'}}>From Bucket</div>
            <div className="row" style={{flexWrap:'wrap', gap:'.5rem'}}>
              {liveBuckets.map(b=>{
                const disabled = b.id===toBucket;
                return (
                  <button type="button" key={b.id} className="chip row" style={{gap:'.32rem', opacity:disabled ? 0.4 : 1, cursor:disabled?'not-allowed':'pointer'}}
                          disabled={disabled} aria-pressed={fromBucket===b.id} onClick={()=>selectFromBucket(b.id)}>
                    {b.name}{b.kind==='protect' && <LockIcon size={11}/>}
                  </button>
                );
              })}
            </div>
            <div className="muted" style={{fontSize:'.8rem', marginTop:'.4rem'}}>Available: <span className="tabular" style={{fontWeight:700, color:'var(--app-ink)'}}>{PESO(fromBal)}</span></div>

            <div className="eyebrow" style={{marginTop:'1.1rem', marginBottom:'.4rem'}}>To Bucket</div>
            <div className="row" style={{flexWrap:'wrap', gap:'.5rem'}}>
              {liveBuckets.map(b=>{
                const disabled = b.id===fromBucket;
                return (
                  <button type="button" key={b.id} className="chip row" style={{gap:'.32rem', opacity:disabled ? 0.4 : 1, cursor:disabled?'not-allowed':'pointer'}}
                          disabled={disabled} aria-pressed={toBucket===b.id} onClick={()=>selectToBucket(b.id)}>
                    {b.name}{b.kind==='protect' && <LockIcon size={11}/>}
                  </button>
                );
              })}
            </div>
            <div className="muted" style={{fontSize:'.8rem', marginTop:'.4rem'}}>Current: <span className="tabular" style={{fontWeight:700, color:'var(--app-ink)'}}>{PESO(toBal)}</span></div>

            <div style={{marginTop:'1.1rem'}}>
              <AmountField id="transfer-amount" value={transferAmount} onChange={setTransferAmount}/>
            </div>

            {fromIsProtected && (
              <div className="card" style={{marginTop:'1.1rem', borderLeft:'4px solid var(--status-warn-icon)'}}>
                <div className="row" style={{gap:'.6rem'}}>
                  <div className="icon-btn" style={{background:'var(--status-warn-bg)', color:'var(--status-warn-icon)', border:'none', width:32, height:32}}>
                    <LockIcon size={15}/>
                  </div>
                  <div style={{fontWeight:800, fontSize:'.9rem', color:'var(--status-warn-text)'}}>&#128274; Protected Money</div>
                </div>
                <div className="muted" style={{fontSize:'.82rem', marginTop:'.5rem', lineHeight:1.4}}>
                  You are moving money out of a protected bucket.
                </div>
              </div>
            )}

            {transferShortfall>0 && (
              <div className="card" style={{marginTop:'.8rem', borderLeft:'4px solid var(--status-bad-icon)'}}>
                <div className="row" style={{gap:'.6rem'}}>
                  <div className="icon-btn" style={{background:'var(--status-bad-bg)', color:'var(--status-bad-icon)', border:'none', width:32, height:32}}>
                    <AlertTriangleIcon size={16}/>
                  </div>
                  <div style={{fontWeight:800, fontSize:'.9rem', color:'var(--status-bad-text)'}}>&#9888; Not enough in {fromB.name}</div>
                </div>
                <div style={{marginTop:'.75rem', display:'grid', gap:'.35rem'}}>
                  <div className="row between">
                    <span className="muted" style={{fontSize:'.82rem'}}>Available</span>
                    <span className="tabular" style={{fontWeight:700, fontSize:'.85rem'}}>{PESO(fromBal)}</span>
                  </div>
                  <div className="row between">
                    <span className="muted" style={{fontSize:'.82rem'}}>Shortfall</span>
                    <span className="tabular" style={{fontWeight:800, fontSize:'.85rem', color:'var(--status-bad-text)'}}>{PESO(transferShortfall)}</span>
                  </div>
                </div>
              </div>
            )}

            <div className="eyebrow" style={{marginTop:'1.1rem', marginBottom:'.6rem'}}>Transfer Preview</div>
            <div className="card">
              <div className="row between">
                <div className="row" style={{gap:'.5rem'}}>
                  <div className="bucket-icon" style={{background:fromB.color, width:30, height:30}}><fromB.Icon size={14}/></div>
                  <span style={{fontWeight:700, fontSize:'.88rem'}}>{fromB.name}</span>
                </div>
                <span className="tabular" style={{fontWeight:700, fontSize:'.85rem'}}>{PESO(fromBal)} &rarr; {fmtSigned(fromBal-transferNum)}</span>
              </div>
              <div className="row between" style={{marginTop:'.65rem', paddingTop:'.65rem', borderTop:'1px solid var(--app-border)'}}>
                <div className="row" style={{gap:'.5rem'}}>
                  <div className="bucket-icon" style={{background:toB.color, width:30, height:30}}><toB.Icon size={14}/></div>
                  <span style={{fontWeight:700, fontSize:'.88rem'}}>{toB.name}</span>
                </div>
                <span className="tabular" style={{fontWeight:700, fontSize:'.85rem'}}>{PESO(toBal)} &rarr; {PESO(toBal+transferNum)}</span>
              </div>
            </div>
            <div className="muted" style={{textAlign:'center', fontSize:'.8rem', marginTop:'.7rem'}}>
              Move money between buckets without changing your total income.
            </div>
          </>
        )}

        {saved && (
          <div className="badge" style={{background:'var(--status-good-bg)', color:'var(--status-good-text)', width:'100%', justifyContent:'center', marginTop:'1rem'}}>
            <CheckCircleIcon size={14}/> Saved &mdash; demo only, not persisted
          </div>
        )}

        <button className="btn-primary" style={{marginTop:'1rem'}} type="submit">{submitLabel}</button>
      </form>
    </div>
  );
}

const GOAL_FUNDING_BUCKETS = ['savings','living','bills','family','wants'];

function GoalsPage({goals, setGoals, buckets}){
  const bucketLookup = Object.fromEntries(buckets.map(b=>[b.id,b]));

  const [addOpen, setAddOpen] = useState(false);
  const [formName, setFormName] = useState('');
  const [formTarget, setFormTarget] = useState('');
  const [formSaved, setFormSaved] = useState('');
  const [formDate, setFormDate] = useState('');
  const [formPriority, setFormPriority] = useState(false);

  const [detailId, setDetailId] = useState(null);
  const [addMoneyOpen, setAddMoneyOpen] = useState(false);
  const [addMoneyAmount, setAddMoneyAmount] = useState('500');
  const [addMoneyBucket, setAddMoneyBucket] = useState('savings');
  const [addMoneyConfirmed, setAddMoneyConfirmed] = useState(false);

  const totalSaved = goals.reduce((s,g)=>s+g.saved,0);
  const totalTarget = goals.reduce((s,g)=>s+g.target,0);
  const totalRemaining = totalTarget - totalSaved;
  const totalPct = totalTarget>0 ? Math.round((totalSaved/totalTarget)*100) : 0;

  const detailGoal = goals.find(g=>g.id===detailId) || null;
  const detailPct = detailGoal ? Math.round((detailGoal.saved/detailGoal.target)*100) : 0;
  const detailComplete = detailPct>=100;
  const detailRemaining = detailGoal ? Math.max(0, detailGoal.target-detailGoal.saved) : 0;

  function openDetail(id){
    setDetailId(id);
    setAddMoneyOpen(false);
    setAddMoneyConfirmed(false);
    setAddMoneyAmount('500');
  }
  function closeDetail(){
    setDetailId(null);
    setAddMoneyOpen(false);
    setAddMoneyConfirmed(false);
  }
  function confirmAddMoney(){
    setAddMoneyConfirmed(true);
    setTimeout(()=>setAddMoneyConfirmed(false), 2200);
  }
  function openAddGoal(){
    setFormName(''); setFormTarget(''); setFormSaved(''); setFormDate(''); setFormPriority(false);
    setAddOpen(true);
  }
  function submitAddGoal(e){
    e.preventDefault();
    const name = formName.trim() || 'New Goal';
    const target = Math.max(1, parseInt(formTarget,10)||0);
    const saved = Math.max(0, parseInt(formSaved,10)||0);
    setGoals(gs=>[...gs, {
      id:'goal-'+Date.now(), name, target, saved,
      Icon:TargetIcon, color:'var(--brand)',
      targetDate: formDate.trim() || null, priority: formPriority,
    }]);
    setAddOpen(false);
  }

  return (
    <>
    <div className="app-scroll">
      <TopBar/>
      <div className="page-head">
        <div className="page-title">Goals</div>
        <div className="page-sub">Turn your money plans into milestones.</div>
      </div>

      <div className="eyebrow" style={{marginBottom:'.6rem'}}>Goal Progress</div>
      <div className="card" style={{marginBottom:'1.3rem'}}>
        <div className="row between">
          <div>
            <div className="muted" style={{fontSize:'.76rem'}}>Total Saved</div>
            <div className="tabular" style={{fontFamily:'var(--font-display)', fontWeight:800, fontSize:'1.35rem', color:'var(--brand)', marginTop:'.15rem'}}>{PESO(totalSaved)}</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div className="muted" style={{fontSize:'.76rem'}}>Total Target</div>
            <div className="tabular" style={{fontWeight:800, fontSize:'1.05rem', marginTop:'.15rem'}}>{PESO(totalTarget)}</div>
          </div>
        </div>
        <div className="progress-track" style={{marginTop:'.9rem'}}>
          <div className="progress-fill" style={{width:Math.min(100,totalPct)+'%', background:'var(--brand)'}}/>
        </div>
        <div className="row between" style={{marginTop:'.55rem'}}>
          <span className="muted" style={{fontSize:'.78rem'}}>{totalPct}% of all goals</span>
          <span className="tabular" style={{fontSize:'.78rem', fontWeight:700}}>{PESO(totalRemaining)} remaining</span>
        </div>
      </div>

      <div className="row between" style={{marginBottom:'.7rem'}}>
        <span className="section-title">Your Goals</span>
      </div>

      <div style={{display:'grid', gap:'.85rem'}}>
        {goals.map(g=>{
          const pct = Math.round((g.saved/g.target)*100);
          const complete = pct>=100;
          const remaining = Math.max(0, g.target-g.saved);
          return (
            <button type="button" key={g.id} className="card" onClick={()=>openDetail(g.id)}
                    style={{textAlign:'left', width:'100%', border: complete ? '1px solid var(--status-good-icon)' : undefined}}>
              <div className="row between" style={{alignItems:'flex-start'}}>
                <div className="row" style={{gap:'.65rem'}}>
                  <div className="bucket-icon" style={{background:g.color}}><g.Icon size={18}/></div>
                  <div>
                    <div className="row" style={{gap:'.4rem'}}>
                      <span style={{fontWeight:700}}>{g.name}</span>
                      {g.priority && (
                        <span className="badge" style={{background:'var(--status-warn-bg)', color:'var(--status-warn-text)', padding:'.15rem .5rem', fontSize:'.66rem'}}>Priority</span>
                      )}
                    </div>
                    <div className="muted tabular" style={{fontSize:'.8rem', marginTop:'.2rem'}}>{PESO(g.saved)} / {PESO(g.target)}</div>
                  </div>
                </div>
                {complete ? (
                  <span className="badge tabular" style={{background:'var(--status-good-bg)', color:'var(--status-good-text)', flexShrink:0}}>
                    <CheckCircleIcon size={13}/> Goal Complete
                  </span>
                ) : (
                  <span className="badge tabular" style={{background:'var(--brand-tint)', color:'var(--brand)', flexShrink:0}}>{pct}% complete</span>
                )}
              </div>
              <div className="progress-track" style={{marginTop:'.8rem'}}>
                <div className="progress-fill" style={{width:Math.min(100,pct)+'%', background: complete ? 'var(--status-good-icon)' : g.color}}/>
              </div>
              <div className="row between" style={{marginTop:'.6rem'}}>
                <span className="muted tabular" style={{fontSize:'.78rem'}}>{complete ? 'Goal reached' : `${PESO(remaining)} remaining`}</span>
                {g.targetDate && <span className="faint" style={{fontSize:'.78rem'}}>Target: {g.targetDate}</span>}
              </div>
            </button>
          );
        })}
      </div>

      <button type="button" className="btn-add-bucket" style={{marginTop:'1rem'}} onClick={openAddGoal}>
        <PlusIcon size={15}/> New Goal

    </div>

    {addOpen && (
      <div className="modal-backdrop" onClick={()=>setAddOpen(false)}>

          <div style={{fontWeight:800, fontSize:'1.05rem', marginBottom:'1.1rem'}}>New Goal</div>

          <label htmlFor="goal-name" className="eyebrow" style={{display:'block', marginBottom:'.4rem'}}>Goal Name</label>
          <input id="goal-name" value={formName} onChange={e=>setFormName(e.target.value)} placeholder="e.g. New Phone" style={{
            width:'100%', padding:'.75rem .9rem', borderRadius:'var(--r-md)', border:'1px solid var(--app-border)',
            background:'var(--app-surface)', fontSize:'.9rem', color:'var(--app-ink)'
          }}/>

          <label htmlFor="goal-target" className="eyebrow" style={{display:'block', marginTop:'1rem', marginBottom:'.4rem'}}>Target Amount</label>
          <div className="row" style={{gap:'.5rem', border:'1px solid var(--app-border)', borderRadius:'var(--r-md)', padding:'.7rem .9rem', background:'var(--app-surface)'}}>
            <span style={{fontWeight:700}}>&#8369;</span>
            <input id="goal-target" inputMode="numeric" value={formTarget} onChange={e=>setFormTarget(e.target.value.replace(/[^0-9]/g,''))}
                   placeholder="0" style={{flex:1, border:'none', outline:'none', background:'transparent', fontSize:'.9rem', color:'var(--app-ink)'}}/>
          </div>

          <label htmlFor="goal-saved" className="eyebrow" style={{display:'block', marginTop:'1rem', marginBottom:'.4rem'}}>Already Saved (optional)</label>
          <div className="row" style={{gap:'.5rem', border:'1px solid var(--app-border)', borderRadius:'var(--r-md)', padding:'.7rem .9rem', background:'var(--app-surface)'}}>
            <span style={{fontWeight:700}}>&#8369;</span>
            <input id="goal-saved" inputMode="numeric" value={formSaved} onChange={e=>setFormSaved(e.target.value.replace(/[^0-9]/g,''))}
                   placeholder="0" style={{flex:1, border:'none', outline:'none', background:'transparent', fontSize:'.9rem', color:'var(--app-ink)'}}/>
          </div>

          <label htmlFor="goal-date" className="eyebrow" style={{display:'block', marginTop:'1rem', marginBottom:'.4rem'}}>Target Date (optional)</label>
          <input id="goal-date" value={formDate} onChange={e=>setFormDate(e.target.value)} placeholder="e.g. December 2026" style={{
            width:'100%', padding:'.75rem .9rem', borderRadius:'var(--r-md)', border:'1px solid var(--app-border)',
            background:'var(--app-surface)', fontSize:'.9rem', color:'var(--app-ink)'
          }}/>

          <div className="row between" style={{marginTop:'1.1rem'}}>
            <div>
              <div style={{fontWeight:700, fontSize:'.88rem'}}>Priority</div>
              <div className="faint" style={{fontSize:'.74rem'}}>Flag this as a priority goal</div>
            </div>
            <button type="button" role="switch" aria-checked={formPriority} className="switch" onClick={()=>setFormPriority(v=>!v)}>
              <span className="switch-knob"/>
            </button>
          </div>

          <div className="row" style={{gap:'.6rem', marginTop:'1.4rem'}}>
            <button type="button" className="btn-ghost" style={{flex:1}} onClick={()=>setAddOpen(false)}>Cancel</button>
            <button type="submit" className="btn-primary" style={{flex:1.5}}>Create Goal</button>
          </div>
        </form>
      </div>
    )}

    {detailGoal && (
      <div className="modal-backdrop" onClick={closeDetail}>
        <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
          <div style={{width:36, height:4, borderRadius:99, background:'var(--app-border)', margin:'0 auto 1rem'}}/>

          <div className="row between" style={{alignItems:'flex-start'}}>
            <div className="row" style={{gap:'.6rem'}}>
              <div className="bucket-icon" style={{background:detailGoal.color}}><detailGoal.Icon size={18}/></div>
              <div>
                <div style={{fontWeight:800, fontSize:'1rem', textTransform:'uppercase', letterSpacing:'.02em'}}>{detailGoal.name}</div>
                {detailGoal.priority && (
                  <span className="badge" style={{background:'var(--status-warn-bg)', color:'var(--status-warn-text)', marginTop:'.3rem', padding:'.15rem .5rem', fontSize:'.66rem'}}>Priority</span>
                )}
              </div>
            </div>
            <button type="button" className="icon-btn" aria-label="Close" onClick={closeDetail}><XIcon size={15}/></button>
          </div>

          {detailComplete && (
            <div className="badge" style={{background:'var(--status-good-bg)', color:'var(--status-good-text)', marginTop:'.9rem'}}>
              <CheckCircleIcon size={14}/> Goal Complete
            </div>
          )}

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'.9rem', marginTop:'1.1rem'}}>

              <div className="muted" style={{fontSize:'.74rem'}}>Target</div>
              <div className="tabular" style={{fontWeight:800, fontSize:'1.05rem', marginTop:'.15rem'}}>{PESO(detailGoal.target)}</div>
            </div>
            <div>
              <div className="muted" style={{fontSize:'.74rem'}}>Saved</div>
              <div className="tabular" style={{fontWeight:800, fontSize:'1.05rem', marginTop:'.15rem', color:'var(--brand)'}}>{PESO(detailGoal.saved)}</div>
            </div>
            <div>
              <div className="muted" style={{fontSize:'.74rem'}}>Remaining</div>
              <div className="tabular" style={{fontWeight:800, fontSize:'1.05rem', marginTop:'.15rem'}}>{PESO(detailRemaining)}</div>
            </div>
            <div>
              <div className="muted" style={{fontSize:'.74rem'}}>Progress</div>
              <div className="tabular" style={{fontWeight:800, fontSize:'1.05rem', marginTop:'.15rem'}}>{detailPct}%</div>

          </div>

          <div className="progress-track" style={{marginTop:'.9rem'}}>
            <div className="progress-fill" style={{width:Math.min(100,detailPct)+'%', background: detailComplete ? 'var(--status-good-icon)' : detailGoal.color}}/>
          </div>

          {detailGoal.targetDate && (
            <div className="muted" style={{fontSize:'.8rem', marginTop:'.7rem'}}>
              Target Date: <span style={{fontWeight:700, color:'var(--app-ink)'}}>{detailGoal.targetDate}</span>
            </div>
          )}

          <div className="row" style={{gap:'.6rem', marginTop:'1.2rem'}}>
            <button type="button" className="btn-primary" style={{flex:1.4}} onClick={()=>setAddMoneyOpen(v=>!v)}>+ Add Money</button>
            <button type="button" className="btn-soon" style={{flex:1, justifyContent:'center'}} title="Editing arrives in a later phase">Edit Goal</button>
          </div>

          {addMoneyOpen && (
            <div className="card" style={{marginTop:'1rem'}}>
              <label htmlFor="goal-add-amount" className="eyebrow" style={{display:'block', marginBottom:'.4rem'}}>Amount</label>
              <div className="row" style={{gap:'.5rem', border:'1px solid var(--app-border)', borderRadius:'var(--r-md)', padding:'.65rem .8rem', background:'var(--app-surface)'}}>
                <span style={{fontWeight:700}}>&#8369;</span>
                <input id="goal-add-amount" inputMode="numeric" value={addMoneyAmount} onChange={e=>setAddMoneyAmount(e.target.value.replace(/[^0-9]/g,''))}
                       style={{flex:1, border:'none', outline:'none', background:'transparent', fontSize:'.9rem', color:'var(--app-ink)'}}/>
              </div>

              <div className="eyebrow" style={{marginTop:'.9rem', marginBottom:'.4rem'}}>From Bucket</div>
              <div className="row" style={{flexWrap:'wrap', gap:'.5rem'}}>
                {GOAL_FUNDING_BUCKETS.map(id=>(
                  <button type="button" key={id} className="chip" aria-pressed={addMoneyBucket===id} onClick={()=>setAddMoneyBucket(id)}>
                    {bucketLookup[id] ? bucketLookup[id].name : id}
                  </button>
                ))}
              </div>

              <div className="muted" style={{fontSize:'.78rem', marginTop:'.8rem', lineHeight:1.4}}>
                This will eventually move money from a Fundora bucket into this goal.
              </div>

              {addMoneyConfirmed ? (
                <div className="badge" style={{background:'var(--status-good-bg)', color:'var(--status-good-text)', width:'100%', justifyContent:'center', marginTop:'.85rem'}}>
                  <CheckCircleIcon size={14}/> Added &mdash; demo only, not persisted
                </div>
              ) : (
                <button type="button" className="btn-primary" style={{marginTop:'.85rem'}} onClick={confirmAddMoney}>Add to Goal</button>
              )}
            </div>
          )}
        </div>
      </div>
    )}
    </>
  );
}

const INSIGHTS_MONTHS = ['July 2026','August 2026','September 2026','October 2026','November 2026'];

function InsightsPage({income, buckets}){
  const [monthIndex, setMonthIndex] = useState(INSIGHTS_MONTHS.indexOf(CURRENT_MONTH));
  const selectedMonth = INSIGHTS_MONTHS[monthIndex];
  const isPopulated = selectedMonth === CURRENT_MONTH;

  const {liveBuckets, allSpent, deficit, protectedRemainingTotal, effectiveProtectedRemaining, availableToSpend} = deriveFinancialSummary(buckets, income);
  const bucketLookup = Object.fromEntries(liveBuckets.map(b=>[b.id,b]));
  const isOverspent = deficit > 0;
  const isProtectedShortfall = !isOverspent && effectiveProtectedRemaining < protectedRemainingTotal;

  // Uncapped — honest even past 100%; only the progress BAR WIDTH gets clamped, same pattern as BucketRow.
  const spentPctOfIncome = income>0 ? Math.round((allSpent/income)*100) : 0;
  const spentBarWidth = Math.min(100, spentPctOfIncome);

  // Actual spending activity across ALL buckets (spend AND protect) — allocation alone is not
  // spending, so only buckets with real used>0 appear here; a Savings/Emergency withdrawal is
  // still real spending and must not be hidden from this analysis.
  const spendingRows = liveBuckets
    .filter(b=>b.used>0)
    .map(b=>({...b, pct: b.amount>0 ? Math.round((b.used/b.amount)*100) : 0}));
  const breakdownRows = [...spendingRows].sort((a,b)=>b.used-a.used);
  const maxBreakdown = Math.max(0, ...breakdownRows.map(r=>r.used));
  const protectedBuckets = liveBuckets.filter(b=>b.kind==='protect');

  const wantsBucket = bucketLookup.wants;
  const wantsPct = wantsBucket.amount>0 ? Math.round((wantsBucket.used/wantsBucket.amount)*100) : 0;
  const wantsRemaining = Math.max(0, wantsBucket.amount - wantsBucket.used);
  const livingBucket = bucketLookup.living;
  const livingPct = livingBucket.amount>0 ? Math.round((livingBucket.used/livingBucket.amount)*100) : 0;
  // Status must agree with actual spend vs allocation — mirrors BucketRow's own over-budget check
  // (used > amount) rather than a percentage, so it can never say "on track" while over budget.
  // amount<=0 is handled without division: over-budget only needs used>amount, and "fully used"
  // is only meaningful when there was a positive amount to fully use.
  const livingOverBudget = livingBucket.used > livingBucket.amount;
  const livingFullyUsed = livingBucket.amount>0 && livingBucket.used===livingBucket.amount;
  const livingOverBy = livingBucket.used - livingBucket.amount;

  // "Where Your Income Stands" bar segments — bounded so they can never overflow the income bar.
  // When overspent, Spent alone fills the bar (Protected/Available both effectively zero) and the
  // deficit is communicated separately rather than as a fake fourth slice of "income".
  const spentSharePct = isOverspent ? 100 : (income>0 ? Math.round((allSpent/income)*100) : 0);
  const protectedSharePct = isOverspent ? 0 : (income>0 ? Math.round((effectiveProtectedRemaining/income)*100) : 0);
  const availableSharePct = isOverspent ? 0 : (income>0 ? Math.max(0, 100 - spentSharePct - protectedSharePct) : 0);

  return (
    <div className="app-scroll">
      <TopBar/>
      <div className="page-head">
        <div className="page-title">Insights</div>
        <div className="page-sub">Understand where your money goes.</div>
      </div>

      <div className="row between" style={{background:'var(--app-surface-2)', borderRadius:'var(--r-pill)', padding:'.4rem .5rem'}}>
        <button type="button" className="icon-btn" style={{background:'var(--app-surface)'}} aria-label="Previous month"
                disabled={monthIndex===0} onClick={()=>setMonthIndex(i=>Math.max(0,i-1))}>
          <ChevronLeftIcon size={16}/>
        </button>
        <span style={{fontWeight:800, fontSize:'.92rem'}}>{selectedMonth}</span>
        <button type="button" className="icon-btn" style={{background:'var(--app-surface)'}} aria-label="Next month"
                disabled={monthIndex===INSIGHTS_MONTHS.length-1} onClick={()=>setMonthIndex(i=>Math.min(INSIGHTS_MONTHS.length-1,i+1))}>
          <ChevronRightIcon size={16}/>
        </button>
      </div>

      {!isPopulated ? (
        <div className="card" style={{marginTop:'1.1rem', textAlign:'center', padding:'2rem 1.2rem'}}>
          <div className="icon-btn brand" style={{margin:'0 auto .8rem'}}><CalendarIcon size={17}/></div>
          <div style={{fontWeight:800, fontSize:'.95rem'}}>No data yet for {selectedMonth}</div>
          <div className="muted" style={{fontSize:'.83rem', marginTop:'.35rem', lineHeight:1.4}}>
            This prototype only has mock activity for {CURRENT_MONTH}.
          </div>
        </div>
      ) : (
        <>
          <div className="eyebrow" style={{marginTop:'1.1rem', marginBottom:'.6rem'}}>Monthly Overview</div>
          <div className="card">
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'.9rem'}}>
              <div>
                <div className="muted" style={{fontSize:'.74rem'}}>Income</div>
                <div className="tabular" style={{fontFamily:'var(--font-display)', fontWeight:800, fontSize:'1.25rem', marginTop:'.15rem'}}>{PESO(income)}</div>
              </div>
              <div>
                <div className="muted" style={{fontSize:'.74rem'}}>Spent</div>
                <div className="tabular" style={{fontWeight:800, fontSize:'1.1rem', marginTop:'.15rem'}}>{PESO(allSpent)}</div>
              </div>
              <div>
                <div className="muted" style={{fontSize:'.74rem'}}>Protected</div>
                <div className="tabular" style={{fontWeight:800, fontSize:'1.1rem', marginTop:'.15rem', color:'var(--brand)'}}>{PESO(effectiveProtectedRemaining)}</div>
              </div>
              <div>
                <div className="muted" style={{fontSize:'.74rem'}}>Available</div>
                <div className="tabular" style={{fontWeight:800, fontSize:'1.1rem', marginTop:'.15rem', color:'var(--brand)'}}>{PESO(availableToSpend)}</div>
              </div>
            </div>

            <div className="row between" style={{marginTop:'1.1rem', paddingTop:'.9rem', borderTop:'1px solid var(--app-border)'}}>

                <span className="badge" style={{background:'var(--status-bad-bg)', color:'var(--status-bad-text)'}}>

                  <span style={{fontWeight:700, fontSize:'.88rem'}}>{b.name}</span>
                </div>
                <div className="row between" style={{marginTop:'.4rem'}}>
                  <span className="muted tabular" style={{fontSize:'.8rem'}}>{PESO(b.used)} of {PESO(b.amount)}</span>
                  <span className="tabular" style={{fontWeight:700, fontSize:'.8rem'}}>{b.pct}% used</span>
                </div>
                <div className="progress-track" style={{marginTop:'.4rem'}}>
                  <div className="progress-fill" style={{width:Math.min(100,b.pct)+'%', background:b.color}}/>
                </div>
              </div>
            ))}
            <div className="row between" style={{paddingTop:'.8rem', borderTop:'1px solid var(--app-border)'}}>
              <span style={{fontWeight:800, fontSize:'.88rem'}}>Total Spent</span>
              <span className="tabular" style={{fontWeight:800, fontSize:'.88rem'}}>{PESO(allSpent)}</span>
            </div>
          </div>

          <div className="row between" style={{marginTop:'1.4rem', marginBottom:'.6rem'}}>
            <span className="section-title">Protected Money</span>
          </div>
          <div className="card">
            {protectedBuckets.map((b,i)=>(
              <div key={b.id} className="row between" style={{padding:'.5rem 0', borderTop:i?'1px solid var(--app-border)':'none'}}>
                <div className="row" style={{gap:'.55rem'}}>
                  <div className="bucket-icon" style={{background:b.color, width:30, height:30}}><b.Icon size={14}/></div>
                  <div className="row" style={{gap:'.3rem'}}>
                    <span style={{fontWeight:700, fontSize:'.88rem'}}>{b.name}</span>
                    <LockIcon size={11} className="faint"/>

                </div>
                <span className="tabular" style={{fontWeight:700, fontSize:'.88rem'}}>{PESO(Math.max(0, b.amount-b.used))}</span>

            <div className="row between" style={{paddingTop:'.75rem', marginTop:'.2rem', borderTop:'1px solid var(--app-border)'}}>
              <span style={{fontWeight:800, fontSize:'.88rem'}}>Total Protected</span>
              <span className="tabular" style={{fontWeight:800, fontSize:'.88rem', color:'var(--brand)'}}>{PESO(effectiveProtectedRemaining)}</span>
            </div>
            <div className="muted" style={{fontSize:'.8rem', marginTop:'.7rem', lineHeight:1.4}}>
              {effectiveProtectedRemaining < protectedRemainingTotal
                ? `Your plan sets aside ${PESO(protectedRemainingTotal)}, but only ${PESO(effectiveProtectedRemaining)} of that is actually left after other spending.`
                : 'Money you’ve intentionally set aside.'}
            </div>
          </div>

          <div className="row between" style={{marginTop:'1.4rem', marginBottom:'.6rem'}}>
            <span className="section-title">Things to Notice</span>

          <div style={{display:'grid', gap:'.7rem'}}>
            <div className="card" style={{borderLeft:'4px solid var(--status-warn-icon)', display:'flex', gap:'.7rem'}}>
              <div className="icon-btn" style={{background:'var(--status-warn-bg)', color:'var(--status-warn-icon)', border:'none', width:34, height:34, flexShrink:0}}>

              </div>
              <div>

                <div className="muted" style={{fontSize:'.82rem', marginTop:'.15rem'}}>You&rsquo;ve used {wantsPct}% of your Wants budget.</div>
                <div className="muted" style={{fontSize:'.82rem'}}>{PESO(wantsRemaining)} remaining.</div>

            {livingOverBudget ? (
              <div className="card" style={{borderLeft:'4px solid var(--status-bad-icon)', display:'flex', gap:'.7rem'}}>

                <div>
                  <div style={{fontWeight:800, fontSize:'.9rem'}}>Living is over budget</div>
                  <div className="muted" style={{fontSize:'.82rem', marginTop:'.15rem'}}>You&rsquo;ve spent {PESO(livingOverBy)} over your Living budget.</div>

                <div className="icon-btn" style={{background:'var(--status-warn-bg)', color:'var(--status-warn-icon)', border:'none', width:34, height:34, flexShrink:0}}>
                  <AlertTriangleIcon size={17}/>

                <div>

                <div className="icon-btn" style={{background:'var(--status-bad-bg)', color:'var(--status-bad-icon)', border:'none', width:34, height:34, flexShrink:0}}>
                  <AlertTriangleIcon size={17}/>
                </div>
                <div>
                  <div style={{fontWeight:800, fontSize:'.9rem'}}>You&rsquo;re overspent</div>

                  <LockIcon size={16}/>
                </div>
                <div>
                  <div style={{fontWeight:800, fontSize:'.9rem'}}>Protected money is at risk</div>

                  <LockIcon size={16}/>

                <div>
                  <div style={{fontWeight:800, fontSize:'.9rem'}}>Protected money is intact</div>
                  <div className="muted" style={{fontSize:'.82rem', marginTop:'.15rem'}}>{PESO(effectiveProtectedRemaining)} remains protected in Savings and Emergency.</div>
                </div>

          <div className="row between" style={{marginTop:'1.4rem', marginBottom:'.6rem'}}>
            <span className="section-title">Spending Breakdown</span>
          </div>
          <div className="card" style={{display:'grid', gap:'.65rem'}}>
            {breakdownRows.map(b=>(
              <div key={b.id} className="row" style={{gap:'.6rem'}}>
                <span className="muted" style={{fontSize:'.8rem', fontWeight:600, width:'3.6rem', flexShrink:0}}>{b.name}</span>
                <div className="progress-track" style={{flex:1}}>
                  <div className="progress-fill" style={{width:(maxBreakdown>0 ? (b.used/maxBreakdown*100) : 0)+'%', background:b.color}}/>

                <span className="tabular" style={{fontSize:'.8rem', fontWeight:700, width:'4.4rem', textAlign:'right', flexShrink:0}}>{PESO(b.used)}</span>
              </div>
            ))}
          </div>

          <div className="row between" style={{marginTop:'1.4rem', marginBottom:'.6rem'}}>
            <span className="section-title">Where Your Income Stands</span>
          </div>
          <div className="card">
            <div className="row" style={{height:14, borderRadius:'var(--r-pill)', overflow:'hidden', background:'var(--app-surface-2)'}}>
              <div style={{width:spentSharePct+'%', background:'var(--app-ink-faint)', height:'100%'}}/>

            <div style={{display:'grid', gap:'.55rem', marginTop:'1rem'}}>

              </div>
              <div className="row between">
                <div className="row" style={{gap:'.4rem'}}>
                  <span style={{width:9,height:9,borderRadius:99,background:'var(--app-ink-faint)',display:'inline-block'}}/>
                  <span className="muted" style={{fontSize:'.84rem'}}>Spent</span>
                </div>
                <span className="tabular" style={{fontWeight:700, fontSize:'.88rem'}}>{PESO(allSpent)}</span>
              </div>
              <div className="row between">
                <div className="row" style={{gap:'.4rem'}}>
                  <span style={{width:9,height:9,borderRadius:99,background:'var(--brand)',display:'inline-block'}}/>
                  <span className="muted" style={{fontSize:'.84rem'}}>Protected</span>
                </div>
                <span className="tabular" style={{fontWeight:700, fontSize:'.88rem'}}>{PESO(effectiveProtectedRemaining)}</span>
              </div>
              <div className="row between">
                <div className="row" style={{gap:'.4rem'}}>
                  <span style={{width:9,height:9,borderRadius:99,background:'var(--brand-bright)',display:'inline-block'}}/>
                  <span className="muted" style={{fontSize:'.84rem'}}>Available to Spend</span>
                </div>
                <span className="tabular" style={{fontWeight:700, fontSize:'.88rem'}}>{PESO(availableToSpend)}</span>
              </div>
            </div>
            {isOverspent ? (
              <div className="muted" style={{fontSize:'.78rem', marginTop:'.9rem', lineHeight:1.4, textAlign:'center', color:'var(--status-bad-text)', fontWeight:700}}>
                {PESO(deficit)} over income
              </div>
            ) : (
              <div className="muted" style={{fontSize:'.78rem', marginTop:'.9rem', lineHeight:1.4, textAlign:'center'}}>
                Income = Spent + Protected + Available
              </div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

function SettingsPage({navigate, income, setIncome, buckets}){
  const [toast, setToast] = useState('');
  function showToast(msg){
    setToast(msg);
    setTimeout(()=>setToast(''), 2200);
  }

  const [profile, setProfile] = useState({name:'Alex', email:'user@example.com'});
  const [profileOpen, setProfileOpen] = useState(false);
  const [formName, setFormName] = useState(profile.name);
  const [formEmail, setFormEmail] = useState(profile.email);
  function openProfile(){ setFormName(profile.name); setFormEmail(profile.email); setProfileOpen(true); }
  function saveProfile(e){
    e.preventDefault();
    setProfile({name: formName.trim() || profile.name, email: formEmail.trim() || profile.email});
    setProfileOpen(false);
  }

  const [incomeSchedule, setIncomeSchedule] = useState('Monthly');
  const [payday, setPayday] = useState('1st');
  const [incomeOpen, setIncomeOpen] = useState(false);
  const [formIncome, setFormIncome] = useState(String(income));
  const [formSchedule, setFormSchedule] = useState(incomeSchedule);
  const [formPayday, setFormPayday] = useState(payday);
  function openIncome(){ setFormIncome(String(income)); setFormSchedule(incomeSchedule); setFormPayday(payday); setIncomeOpen(true); }
  function saveIncome(e){
    e.preventDefault();
    // Settings REPLACES the total monthly income (unlike Add Transaction's Income, which is additive).
    setIncome(parseInt(formIncome, 10) || 0);
    setIncomeSchedule(formSchedule);
    setPayday(formPayday);
    setIncomeOpen(false);
  }

  const [currency, setCurrency] = useState('PHP');
  const [currencyOpen, setCurrencyOpen] = useState(false);
  const [currencySearch, setCurrencySearch] = useState('');
  const filteredCurrencies = CURRENCIES.filter(c=>{
    const q = currencySearch.trim().toLowerCase();
    return !q || c.code.toLowerCase().includes(q) || c.name.toLowerCase().includes(q);

/* ============================== app shell ============================== */
function App(){
  const [route, navigate] = useRoute();
  // Phase A1: read the persisted blob exactly once, synchronously, before any of the state below
  // is created — so the very first render already reflects either hydrated data or safe defaults,
  // never a default-then-overwrite flash. `persistenceOK` false means the stored value was
  // malformed/unsupported; writes stay suspended for the session so it's never silently clobbered.
  const [persisted] = useState(loadPersistedState);
  const persistenceEnabledRef = useRef(persisted.persistenceOK);

  // Session-level shared financial state — the one source of truth every screen reads/writes.
  // Now persisted to localStorage (see the write effect below); hydrated from `persisted` above.
  const [income, setIncome] = useState(() => persisted.income);
  const [buckets, setBuckets] = useState(() => persisted.buckets);
  const [goals, setGoals] = useState(() => persisted.goals);
  // Activity log — a record of successful Income/Expense actions, NOT a source of truth for
  // current balances. Home/Plan/Insights continue to derive everything from income/buckets.
  const [transactions, setTransactions] = useState(() => persisted.transactions);
  // Phase B1 foundation only — an inert container for future historical monthly snapshots.
  // Nothing in this app writes into it yet; no component receives it; no financial handler
  // reads it. It exists purely so the persisted schema and its migration path are proven safe
  // before any later phase starts putting real period data inside.
  const [periods, setPeriods] = useState(() => persisted.periods);

  // Single centralized persistence write path — the only place localStorage is touched from a
  // React effect. No mutation handler anywhere (Plan, Add Transaction, Settings, etc.) contains
  // any localStorage logic; they only ever call the setters above, exactly as before Phase A1.
  // Phase A2: a failed write latches persistence off for the rest of the session (a plain ref,
  // no new React state/context/timer), mirroring how a failed read is already handled.
  useEffect(() => {
    if(!persistenceEnabledRef.current) return;
    const ok = saveState({income, buckets, goals, transactions, periods});
    if(!ok) persistenceEnabledRef.current = false;
  }, [income, buckets, goals, transactions, periods]);

  // Corrects an existing EXPENSE transaction: reverses the OLD bucket effect and applies the NEW
  // one in a single setBuckets pass, using the transaction's OWN stored old values (never trusting
  // whatever the edit form currently shows) so the correction is always based on real prior state.
  function editExpenseTransaction(id, changes){
    const oldTxn = transactions.find(t=>t.id===id);
    if(!oldTxn || oldTxn.type!=='expense') return;               // must exist and be an expense
    const newAmount = Number(changes.amount);
    const newBucketId = changes.bucketId;
    if(!(newAmount>0)) return;                                    // amount must be a valid positive number
    if(!buckets.some(b=>b.id===newBucketId)) return;               // new bucket must currently exist
    if(!changes.date) return;                                      // date must be present
    const oldAmount = oldTxn.amount;
    const oldBucketId = oldTxn.bucketId;
    // Category identity snapshot only refreshes when the bucket actually changes — an amount/
    // note/date-only edit must never touch it (preserved automatically by the spread below, or
    // stays absent for an old pre-B2 transaction — never opportunistically backfilled, since we
    // can't know whether today's live name matches what was true when it was first created).
    // The new bucket is already confirmed to exist via the buckets.some(...) guard above.
    const bucketChanged = newBucketId !== oldBucketId;
    const newBucket = bucketChanged ? buckets.find(b=>b.id===newBucketId) : null;

    setBuckets(bs => bs.map(b => {
      if(b.id===oldBucketId && b.id===newBucketId){
        // same bucket — apply the net delta once, never subtract-then-add as two separate updates
        return {...b, used: Math.max(0, b.used - oldAmount + newAmount)};
      }
      if(b.id===oldBucketId){
        // reverse the old effect (if the old bucket no longer exists, this simply matches nothing —
        // nothing to subtract from, which is exactly correct, not an error)
        return {...b, used: Math.max(0, b.used - oldAmount)};
      }
      if(b.id===newBucketId){
        return {...b, used: b.used + newAmount};
      }
      return b;
    }));

    setTransactions(ts => ts.map(t => t.id===id
      ? {
          ...t, amount:newAmount, bucketId:newBucketId, note:(changes.note||'').trim(), date:changes.date,
          ...(bucketChanged ? { bucketNameSnapshot:newBucket.name, bucketKindSnapshot:newBucket.kind } : {}),
        }
      : t
    ));
  }

  // Deletes an existing EXPENSE transaction: reverses its bucket effect using the transaction's
  // OWN stored amount/bucketId (never trusting form state), then removes the record. If the bucket
  // no longer exists, there's simply nothing to reverse — the transaction is still safely removed.
  function deleteExpenseTransaction(id){
    const txn = transactions.find(t=>t.id===id);
    if(!txn || txn.type!=='expense') return;
    setBuckets(bs => bs.map(b => b.id===txn.bucketId ? {...b, used: Math.max(0, b.used - txn.amount)} : b));
    setTransactions(ts => ts.filter(t => t.id!==id));
  }

  // Corrects an existing INCOME transaction. Income transactions are not the source of truth for
  // total income — `income` is — so the correction is delta-based: subtract the transaction's OWN
  // stored old amount and add the new one, rather than replacing or re-adding the full amount.
  // Never touches buckets.used; bucket allocations simply re-derive from the new income naturally.
  function editIncomeTransaction(id, changes){
    const oldTxn = transactions.find(t=>t.id===id);
    if(!oldTxn || oldTxn.type!=='income') return;              // must exist and be an income record
    const newAmount = Number(changes.amount);
    if(!(Number.isFinite(newAmount) && newAmount>0)) return;    // amount must be a valid positive number
    if(!changes.date) return;                                   // date must be present
    const oldAmount = oldTxn.amount;

    setIncome(prev => Math.max(0, prev - oldAmount + newAmount));

    setTransactions(ts => ts.map(t => t.id===id
      ? {...t, amount:newAmount, source:changes.source, date:changes.date}
      : t
    ));
  }

  // Deletes an existing INCOME transaction: subtracts its OWN saved amount from shared `income`
  // (never recomputed from transaction history — Settings can replace income independently of it),
  // then removes the record. Never touches buckets.used; allocations simply re-derive from the
  // lower income naturally, and may legitimately push the app into a partial-shortage/overspent state.
  function deleteIncomeTransaction(id){
    const txn = transactions.find(t=>t.id===id);
    if(!txn || txn.type!=='income') return;
    const savedAmount = txn.amount;
    if(!(Number.isFinite(savedAmount) && savedAmount>0)) return;
    setIncome(prev => Math.max(0, prev - savedAmount));
    setTransactions(ts => ts.filter(t => t.id!==id));
  }

  const pages = {
    onboarding: <OnboardingPage navigate={navigate} buckets={buckets}/>,
    home: <HomePage navigate={navigate} income={income} buckets={buckets} transactions={transactions} editExpenseTransaction={editExpenseTransaction} deleteExpenseTransaction={deleteExpenseTransaction} editIncomeTransaction={editIncomeTransaction} deleteIncomeTransaction={deleteIncomeTransaction}/>,
    plan: <PlanPage buckets={buckets} setBuckets={setBuckets} income={income}/>,
    transactions: <TransactionsPage income={income} setIncome={setIncome} buckets={buckets} setBuckets={setBuckets} transactions={transactions} setTransactions={setTransactions}/>,
    goals: <GoalsPage goals={goals} setGoals={setGoals} buckets={buckets}/>,
    insights: <InsightsPage income={income} buckets={buckets}/>,
    settings: <SettingsPage navigate={navigate} income={income} setIncome={setIncome} buckets={buckets}/>,
  };
  return (
    <>
      {pages[route]}
      {route !== 'onboarding' && <BottomNav route={route} navigate={navigate}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
