<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fundora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- outer reviewer-harness tokens (theme-aware) ---------- */
  :root{
    --page-bg:#f3f1ea;
    --page-surface:#fdfcf8;
    --page-ink:#2b2a26;
    --page-ink-soft:#6f6c62;
    --page-border:rgba(20,20,18,.10);
    --page-accent:#0e4f3d;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#15170f;
      --page-surface:#1d2018;
      --page-ink:#eeece4;
      --page-ink-soft:#a5a294;
      --page-border:rgba(255,255,255,.10);
      --page-accent:#3fcf9e;
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#15170f;
    --page-surface:#1d2018;
    --page-ink:#eeece4;
    --page-ink-soft:#a5a294;
    --page-border:rgba(255,255,255,.10);
    --page-accent:#3fcf9e;
  }

  /* ---------- fixed Fundora product tokens (brand-locked, not theme swapped) ---------- */
  :root{
    --app-bg:#f7f4ec;
    --app-surface:#ffffff;
    --app-surface-2:#f1ede2;
    --app-border:rgba(24,22,16,.09);
    --app-ink:#221f1a;
    --app-ink-soft:#716b5c;
    --app-ink-faint:#a39c8a;

    --brand:#0e4f3d;
    --brand-ink:#0e4f3d;
    --brand-strong:#0a3b2d;
    --brand-bright:#1c8c6c;
    --brand-tint:#e2f0e8;

    /* categorical bucket colors — fixed order, validated CVD-safe set */
    --cat-living:#2a78d6;
    --cat-bills:#eb6834;
    --cat-savings:#1baf7a;
    --cat-emergency:#c98500;
    --cat-family:#e87ba4;
    --cat-wants:#2f8f3a;

    --status-good-icon:#0ca30c;
    --status-good-text:#1c6b1c;
    --status-good-bg:#e4f5e2;

    --status-warn-icon:#e0a112;
    --status-warn-text:#8a5c0a;
    --status-warn-bg:#fdf1d9;

    --status-bad-icon:#d03b3b;
    --status-bad-text:#a32d2a;
    --status-bad-bg:#fbe8e6;

    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --shadow-sm:0 1px 2px rgba(20,20,18,.07);
    --shadow-md:0 12px 28px -16px rgba(20,20,18,.28);
    --font-display:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    --font-body:'Manrope',system-ui,-apple-system,sans-serif;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--page-ink);
    font-family:var(--font-body);
    padding-inline:16px;
    padding-block:28px;
  }
  button,input{font-family:inherit;}
  button{cursor:pointer;}
  h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;}
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.001ms !important; animation-duration:.001ms !important;}
  }
  :focus-visible{outline:2px solid var(--page-accent); outline-offset:2px; border-radius:4px;}

  .stage{display:flex; justify-content:center;}

  /* ---------- phone frame ---------- */
  .phone-shell{
    position:relative;
    width:392px;
    height:min(844px, 88vh);
    background:#0b0b0a;
    border-radius:46px;
    padding:14px;
    box-shadow:var(--shadow-md), 0 0 0 1px rgba(0,0,0,.35);
    flex-shrink:0;
  }
  .phone-notch{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:120px; height:22px; background:#0b0b0a; border-radius:0 0 16px 16px; z-index:5;
  }
  .phone-screen{
    position:relative;
    width:100%; height:100%;
    background:var(--app-bg);
    border-radius:32px;
    overflow:hidden;
    display:flex; flex-direction:column;
    font-family:var(--font-body);
    color:var(--app-ink);
  }
  @media (max-width:560px){
    body{padding-inline:16px;}
    .phone-shell{width:100%; height:100dvh; border-radius:0; padding:0; box-shadow:none;}
    .phone-notch{display:none;}
    .phone-screen{border-radius:0;}
  }

  .app-scroll{flex:1 1 auto; overflow-y:auto; padding:1.1rem 1.15rem 1.4rem;}
  .app-scroll::-webkit-scrollbar{width:0;}

  /* ---------- shared UI ---------- */
  .row{display:flex; align-items:center;}
  .between{justify-content:space-between;}
  .wordmark{display:flex; align-items:center; gap:.5rem;}
  .f-mark{
    width:34px; height:34px; border-radius:10px; background:var(--brand);
    color:#fff; font-family:var(--font-display); font-weight:800; font-size:1.05rem;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    position:relative;
  }
  .f-mark::after{
    content:""; position:absolute; right:6px; bottom:7px; width:5px; height:5px;
    border-radius:2px; background:var(--brand-bright);
  }
  .wordmark-text{font-family:var(--font-display); font-weight:800; font-size:1.12rem; letter-spacing:-.01em; color:var(--app-ink);}

  .icon-btn{
    width:38px; height:38px; border-radius:var(--r-pill); border:1px solid var(--app-border);
    background:var(--app-surface); color:var(--app-ink-soft); display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .icon-btn.brand{background:var(--brand-tint); color:var(--brand); border-color:transparent;}

  .card{
    background:var(--app-surface); border:1px solid var(--app-border); border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm); padding:1.15rem;
  }
  .section-title{font-size:.98rem; font-weight:800; font-family:var(--font-display); color:var(--app-ink);}
  .muted{color:var(--app-ink-soft);}
  .faint{color:var(--app-ink-faint);}
  .eyebrow{font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--app-ink-faint);}

  .btn-primary{
    background:var(--brand); color:#fff; border:none; border-radius:var(--r-md);
    padding:.95rem 1.2rem; font-weight:700; font-size:.95rem; width:100%;
    box-shadow:0 10px 22px -12px rgba(14,79,61,.55);
  }
  .btn-primary:active{background:var(--brand-strong);}
  .btn-ghost{
    background:transparent; border:1px solid var(--app-border); color:var(--app-ink);
    border-radius:var(--r-pill); padding:.5rem 1rem; font-weight:700; font-size:.8rem;
  }
  .btn-soon{
    background:var(--app-surface-2); border:1px dashed var(--app-border); color:var(--app-ink-faint);
    border-radius:var(--r-pill); padding:.5rem .95rem; font-weight:700; font-size:.76rem;
    display:flex; align-items:center; gap:.3rem; cursor:not-allowed;
  }

  .tabular{font-variant-numeric:tabular-nums;}

  .progress-track{
    height:8px; border-radius:var(--r-pill); background:var(--app-surface-2); overflow:hidden;
  }
  .progress-fill{height:100%; border-radius:var(--r-pill); transition:width .5s ease;}

  .chip{
    border:1px solid var(--app-border); background:var(--app-surface); color:var(--app-ink);
    padding:.5rem .85rem; border-radius:var(--r-pill); font-size:.83rem; font-weight:600;
  }
  .chip[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:#fff;}

  .badge{
    display:inline-flex; align-items:center; gap:.35rem; font-size:.78rem; font-weight:700;
    padding:.32rem .65rem; border-radius:var(--r-pill);
  }

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-around;
    padding:.55rem .6rem calc(.6rem + env(safe-area-inset-bottom,0px));
    background:var(--app-surface); border-top:1px solid var(--app-border);
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:.2rem; background:none; border:none;
    color:var(--app-ink-faint); font-size:.66rem; font-weight:700; padding:.3rem .5rem; width:56px;
  }
  .nav-item[aria-current="true"]{color:var(--brand);}
  .nav-fab{
    width:52px; height:52px; border-radius:var(--r-pill); background:var(--brand); color:#fff;
    display:flex; align-items:center; justify-content:center; border:none; margin-top:-26px;
    box-shadow:0 12px 22px -10px rgba(14,79,61,.6); flex-shrink:0;
  }
  .nav-fab[aria-current="true"]{background:var(--brand-strong);}

  /* ---------- page header ---------- */
  .page-head{margin-bottom:1.1rem;}
  .page-title{font-size:1.3rem; font-weight:800;}
  .page-sub{color:var(--app-ink-soft); font-size:.85rem; margin-top:.2rem;}

  /* ---------- goals / bucket rows ---------- */
  .bucket-row{padding-bottom:.9rem;}
  .bucket-row + .bucket-row{margin-top:0; padding-top:.9rem; border-top:1px solid var(--app-border);}
  .bucket-row:last-child{padding-bottom:0;}
  .bucket-icon{
    width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; color:#fff;
  }

  /* ---------- onboarding ---------- */
  .ob-dot{width:7px; height:7px; border-radius:50%; background:var(--app-border);}
  .ob-dot[aria-current="true"]{background:var(--brand); width:20px; border-radius:4px;}

  /* ---------- plan screen ---------- */
  .plan-row{border:1px solid var(--app-border); border-radius:var(--r-md); padding:.9rem .95rem;}
  .plan-row + .plan-row{margin-top:.65rem;}
  .stepper{display:flex; align-items:center; gap:.5rem;}
  .stepper-btn{
    width:30px; height:30px; border-radius:var(--r-pill); border:1px solid var(--app-border);
    background:var(--app-surface-2); color:var(--app-ink); font-weight:800; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .stepper-btn:active{background:var(--brand-tint); color:var(--brand); border-color:var(--brand);}
  .pct-input{
    width:3.4rem; text-align:center; font-weight:800; font-size:.92rem; font-family:var(--font-display);
    border:1px solid var(--app-border); border-radius:var(--r-sm); padding:.4rem .2rem;
    background:var(--app-surface); color:var(--app-ink);
  }
  .delete-btn{
    width:28px; height:28px; border-radius:var(--r-pill); border:1px solid var(--status-bad-icon);
    background:transparent; color:var(--status-bad-icon); display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .btn-add-bucket{
    width:100%; border:1.5px dashed var(--app-border); background:var(--app-surface); color:var(--brand);
    border-radius:var(--r-lg); padding:.95rem; font-weight:700; font-size:.88rem;
    display:flex; align-items:center; justify-content:center; gap:.4rem;
  }
  .switch{
    position:relative; width:44px; height:26px; border-radius:var(--r-pill); background:var(--app-surface-2);
    border:1px solid var(--app-border); flex-shrink:0; padding:0;
  }
  .switch[aria-checked="true"]{background:var(--brand); border-color:var(--brand);}
  .switch-knob{
    position:absolute; top:1px; left:1px; width:22px; height:22px; border-radius:50%; background:#fff;
    box-shadow:var(--shadow-sm); transition:transform .18s ease;
  }
  .switch[aria-checked="true"] .switch-knob{transform:translateX(18px);}
  .modal-backdrop{
    position:absolute; inset:0; background:rgba(10,10,8,.5); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    width:100%; background:var(--app-surface); border-radius:24px 24px 0 0;
    padding:1.1rem 1.25rem calc(1.3rem + env(safe-area-inset-bottom,0px));
    box-shadow:0 -14px 30px rgba(0,0,0,.25);
    max-height:90%; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }

  /* ---------- settings screen ---------- */
  .settings-row{
    width:100%; background:none; border:none; padding:.85rem 0; text-align:left;
    display:flex; align-items:center; justify-content:space-between; color:inherit; font:inherit; gap:.6rem;
  }
  .settings-row + .settings-row{border-top:1px solid var(--app-border);}
  .seg{display:flex; gap:.4rem; background:var(--app-surface-2); padding:.3rem; border-radius:var(--r-pill);}
  .seg-btn{
    flex:1; border:none; background:transparent; padding:.5rem .4rem; border-radius:var(--r-pill);
    font-weight:700; font-size:.8rem; color:var(--app-ink-faint);
  }
  .seg-btn[aria-pressed="true"]{background:var(--app-surface); color:var(--app-ink); box-shadow:var(--shadow-sm);}
</style>

<div class="stage">
  <div class="phone-shell">
    <div class="phone-notch"></div>
    <div class="phone-screen" id="root"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

const CURRENT_MONTH = 'September 2026';

// Suggested starting allocation template — a brand-new user has no income or spending/saving
// activity yet, so every bucket's `used` starts at 0. Bucket peso `amount` is NEVER stored as
// state anywhere in the app: it is always derived at render time from the CURRENT shared income
// and the bucket's own `pct` (see deriveBuckets below), so Home/Plan/Add Transaction/Insights can
// never disagree about amounts the way an independently stored/hard-coded value could drift.
// paceDays/paceStartDate are OPTIONAL Budget Pace metadata (unset = null on every bucket,
// spend or protect, for a uniform object shape) — see deriveBudgetPace. Protect buckets never
// get a UI to change them and will simply stay null forever.
const BUCKET_TEMPLATE = [
  {id:'living',    name:'Living',    pct:30, used:0, kind:'spend',   color:'var(--cat-living)',    Icon:HomeIcon,    paceDays:null, paceStartDate:null},
  {id:'bills',     name:'Bills',     pct:20, used:0, kind:'spend',   color:'var(--cat-bills)',     Icon:ReceiptIcon, paceDays:null, paceStartDate:null},
  {id:'savings',   name:'Savings',   pct:20, used:0, kind:'protect', color:'var(--cat-savings)',   Icon:SproutIcon,  paceDays:null, paceStartDate:null},
  {id:'emergency', name:'Emergency', pct:10, used:0, kind:'protect', color:'var(--cat-emergency)', Icon:ShieldIcon,  paceDays:null, paceStartDate:null},
  {id:'family',    name:'Family',    pct:10, used:0, kind:'spend',   color:'var(--cat-family)',    Icon:UsersIcon,   paceDays:null, paceStartDate:null},
  {id:'wants',     name:'Wants',     pct:10, used:0, kind:'spend',   color:'var(--cat-wants)',     Icon:BagIcon,     paceDays:null, paceStartDate:null},
];
// Seeds for App()'s session-level shared state — called once each, at App's first mount.
const initialBuckets = () => BUCKET_TEMPLATE.map(b=>({...b, custom:false}));
// A brand-new user has created no goals yet — the Goals screen starts empty;
// "+ New Goal" is the primary call to action.
const initialGoals = () => [];

// ---- shared-state derivation helpers (single source of truth: session `income` + `buckets`) ----
// A bucket's peso amount, computed fresh from the CURRENT income — never stored.
const bucketAmountFor = (income, pct) => Math.round(income*Number(pct||0)/100);
// One bucket, annotated with its live `amount` and `available` balance.
// Protected buckets' available balance is the full protected amount; spend buckets' is amount-used.
function withDerived(bucket, income){
  const amount = bucketAmountFor(income, bucket.pct);
  const available = bucket.kind==='protect' ? amount : amount - bucket.used;
  return {...bucket, amount, available};
}
// The full shared bucket list, annotated with live amount/available — recompute wherever needed,
// never cache/store the result, so it can never go stale relative to the live income/buckets state.
const deriveBuckets = (buckets, income) => buckets.map(b=>withDerived(b, income));

// The single shared financial-summary definitions — Home and Insights both call this instead of
// keeping their own copies, so "Total Spent"/"Total Remaining"/"Protected"/"Available" can never
// drift apart again. Allocation is not spending: Protected is the CURRENT remaining protected
// balance (amount minus any actual withdrawal), not the original Savings/Emergency allocation.
//
// totalRemaining is RAW and can go negative — it is never clamped here. protectedRemainingTotal
// stays PLAN-LEVEL (sum of each protect bucket's own unused allocation) and is intentionally left
// unchanged, since it still has valid meaning per-bucket. effectiveProtectedRemaining is the
// SUMMARY-LEVEL figure: the planned protected total capped by what actual money is left overall,
// so Money Status can never claim more money is protected than the user actually has remaining.
function deriveFinancialSummary(buckets, income){
  const liveBuckets = deriveBuckets(buckets, income);
  const allSpent = liveBuckets.reduce((s,b)=>s+b.used, 0);
  const totalRemaining = income - allSpent;
  const deficit = Math.max(0, -totalRemaining);
  const protectedRemainingTotal = liveBuckets
    .filter(b=>b.kind==='protect')
    .reduce((s,b)=>s+Math.max(0, b.amount-b.used), 0);
  const effectiveProtectedRemaining = Math.min(protectedRemainingTotal, Math.max(0, totalRemaining));
  const availableToSpend = Math.max(0, totalRemaining - effectiveProtectedRemaining);
  return {
    liveBuckets, allSpent, totalRemaining, deficit,
    protectedRemainingTotal, effectiveProtectedRemaining, availableToSpend,
  };
}

// ---- Budget Pace infrastructure (calculation only — no UI, no bucket fields yet) ----
// Builds a LOCAL calendar 'YYYY-MM-DD' string from a Date's own local getFullYear/getMonth/
// getDate — never toISOString() (UTC-based; can land on the wrong local calendar date near
// midnight in UTC+ timezones). Scoped to Budget Pace only; the existing TransactionsPage
// default-date `new Date().toISOString().slice(0,10)` pattern is a separate, pre-existing
// issue and is intentionally left untouched by this feature.
function paceLocalDateStr(d = new Date()){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// Phase B1 foundation: local calendar 'YYYY-MM' month key — same local-getter approach as
// paceLocalDateStr (never toISOString()), just without the day segment. Not yet wired into any
// financial behavior; an existing transaction's month can already be read via date.slice(0,7)
// since transaction dates are already local 'YYYY-MM-DD' strings.
function localMonthKey(d = new Date()){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  return `${y}-${m}`;
}

// Strictly parses 'YYYY-MM-DD' into a LOCAL-midnight Date, rejecting anything malformed or
// calendar-impossible (e.g. '2026-02-30') instead of letting the Date constructor silently
// roll it over to a different date. Returns null on any invalid input.
function parseLocalDateStrict(dateStr){
  if(typeof dateStr !== 'string') return null;
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
  if(!match) return null;
  const year = Number(match[1]), month = Number(match[2]), day = Number(match[3]);
  const d = new Date(year, month-1, day);
  if(d.getFullYear()!==year || d.getMonth()!==month-1 || d.getDate()!==day) return null;
  return d;
}

// Pure, deterministic Budget Pace calculation. Never reads transactions, never mutates state,
// never calls new Date()/setState internally — `today` is always supplied explicitly by the
// caller so results are fully testable across boundary dates (month/year/leap-year/DST).
//
// Status priority (most to least specific): invalid > inactive > over-budget > fully-used >
// completed > active. over-budget and fully-used are checked ahead of completed so a finished
// pace period still truthfully reports WHY nothing is left, rather than just "time's up".
function deriveBudgetPace(amount, used, paceDays, paceStartDate, today){
  const EMPTY = { status:null, categoryRemaining:null, elapsedDays:null, daysRemaining:null, suggestedDaily:null };

  const hasConfig = paceDays!=null || paceStartDate!=null;
  if(!hasConfig) return { ...EMPTY, status:'inactive' };

  const daysNum = Number(paceDays);
  const validDays = paceDays!=null && Number.isInteger(daysNum) && daysNum>0;
  const startDate = parseLocalDateStrict(paceStartDate);
  const todayDate = parseLocalDateStrict(today);
  if(!validDays || !startDate || !todayDate) return { ...EMPTY, status:'invalid' };

  const elapsedDays = Math.round((todayDate - startDate) / 86400000);
  // V1 has no concept of a pace that hasn't started yet — a future start date is malformed input.
  if(elapsedDays < 0) return { ...EMPTY, status:'invalid' };

  const daysRemaining = daysNum - elapsedDays;
  const categoryRemaining = Math.max(0, amount - used);
  const isOverBudget = used > amount;

  let status;
  if(isOverBudget) status = 'over-budget';
  else if(categoryRemaining === 0) status = 'fully-used';
  else if(daysRemaining <= 0) status = 'completed';
  else status = 'active';

  const suggestedDaily = status==='active' ? Math.floor(categoryRemaining / daysRemaining) : null;

  return { status, categoryRemaining, elapsedDays, daysRemaining, suggestedDaily };
}

// ---- Phase A1: local persistence (localStorage) — calculation/serialization only, no UI ----
// Explicit allowlist of the icon components currently reachable on a persisted bucket/goal —
// React component references can never be safely JSON.stringify/parse'd, so persisted JSON stores
// a stable string key instead, and hydration rehydrates back to the exact live shape {..., Icon}.
const ICON_REGISTRY = {
  home: HomeIcon, receipt: ReceiptIcon, sprout: SproutIcon, shield: ShieldIcon,
  users: UsersIcon, bag: BagIcon, tag: TagIcon, target: TargetIcon,
};
const ICON_KEY_BY_COMPONENT = new Map(Object.entries(ICON_REGISTRY).map(([key, Comp]) => [Comp, key]));
const iconKeyFor = (Icon) => ICON_KEY_BY_COMPONENT.get(Icon) || null;

const STORAGE_KEY = 'fundora_data_v1';
const isFiniteNumber = (n) => typeof n === 'number' && Number.isFinite(n);
const isPlainObject = (v) => v!==null && typeof v==='object' && !Array.isArray(v);
const TXN_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

// Lenient, per-field coercion — drops only what genuinely can't be recovered (id, financial
// amounts), falls back on cosmetic/recoverable fields (name, color, icon) rather than rejecting
// the whole record. paceDays/paceStartDate get only light type-sanity checks here; any further
// malformed combination is already safely handled by deriveBudgetPace's own 'invalid' status —
// this intentionally does not duplicate that logic.
function hydrateBucket(raw){
  if(!raw || typeof raw!=='object' || typeof raw.id!=='string' || raw.id==='') return null;
  const pctNum = Number(raw.pct);
  const pct = isFiniteNumber(pctNum) ? Math.min(100, Math.max(0, pctNum)) : 0;
  const usedNum = Number(raw.used);
  const used = isFiniteNumber(usedNum) ? Math.max(0, usedNum) : 0;
  const kind = (raw.kind==='spend' || raw.kind==='protect') ? raw.kind : 'spend';
  const name = (typeof raw.name==='string' && raw.name.trim()) ? raw.name : 'Bucket';
  const color = (typeof raw.color==='string' && raw.color) ? raw.color : '#7c5cff';
  const custom = !!raw.custom;
  const Icon = ICON_REGISTRY[raw.iconKey] || TagIcon;
  const paceDays = (raw.paceDays===null || typeof raw.paceDays==='number') ? raw.paceDays : null;
  const paceStartDate = (raw.paceStartDate===null || typeof raw.paceStartDate==='string') ? raw.paceStartDate : null;
  return { id:raw.id, name, pct, used, kind, color, Icon, custom, paceDays, paceStartDate };
}
function hydrateGoal(raw){
  if(!raw || typeof raw!=='object' || typeof raw.id!=='string' || raw.id==='') return null;
  const targetNum = Number(raw.target);
  if(!(isFiniteNumber(targetNum) && targetNum>0)) return null; // no meaningful goal without a real target
  const savedNum = Number(raw.saved);
  const saved = isFiniteNumber(savedNum) ? Math.max(0, savedNum) : 0;
  const name = (typeof raw.name==='string' && raw.name.trim()) ? raw.name : 'Goal';
  const color = (typeof raw.color==='string' && raw.color) ? raw.color : 'var(--brand)';
  const Icon = ICON_REGISTRY[raw.iconKey] || TargetIcon;
  const targetDate = (typeof raw.targetDate==='string' && raw.targetDate) ? raw.targetDate : null;
  const priority = !!raw.priority;
  return { id:raw.id, name, target:targetNum, saved, Icon, color, targetDate, priority };
}
function hydrateTransaction(raw){
  if(!raw || typeof raw!=='object' || typeof raw.id!=='string' || raw.id==='') return null;
  if(raw.type!=='expense' && raw.type!=='income') return null;
  const amountNum = Number(raw.amount);
  if(!(isFiniteNumber(amountNum) && amountNum>0)) return null;
  if(typeof raw.date!=='string' || !TXN_DATE_RE.test(raw.date)) return null;
  if(raw.type==='expense'){
    if(typeof raw.bucketId!=='string' || raw.bucketId==='') return null;
    const note = typeof raw.note==='string' ? raw.note : '';
    const base = { id:raw.id, type:'expense', amount:amountNum, bucketId:raw.bucketId, note, date:raw.date };
    // Optional, forward-looking category identity for future historical Reports only — never
    // required, never fabricated. Malformed or missing values are simply omitted (not defaulted,
    // and specifically never defaulted to 'spend' — absence is safer than inventing history) so
    // an otherwise-valid transaction is never dropped over bad snapshot metadata.
    const nameSnapshot = typeof raw.bucketNameSnapshot==='string' ? raw.bucketNameSnapshot.trim() : '';
    const kindSnapshot = (raw.bucketKindSnapshot==='spend' || raw.bucketKindSnapshot==='protect') ? raw.bucketKindSnapshot : null;
    return {
      ...base,
      ...(nameSnapshot ? { bucketNameSnapshot: nameSnapshot } : {}),
      ...(kindSnapshot ? { bucketKindSnapshot: kindSnapshot } : {}),
    };
  }
  const source = typeof raw.source==='string' ? raw.source : '';
  return { id:raw.id, type:'income', amount:amountNum, source, date:raw.date };
}

// Keeps the FIRST valid occurrence of each id, drops later duplicates, preserves original order.
// Never merges/sums duplicate records and never invents a replacement id — an ambiguous later
// entry is simply dropped. Applied only during hydration, never touches the live edit/delete
// handlers (which continue to identify records by id exactly as before).
function dedupeById(items){
  const seen = new Set();
  return items.filter(item => {
    if(seen.has(item.id)) return false;
    seen.add(item.id);
    return true;
  });
}

// Reads and validates the single persisted blob exactly once, synchronously — App feeds this
// straight into its useState lazy initializers so the first render already reflects either
// hydrated data or safe defaults (no default-then-overwrite race). Never throws: any structural
// (Tier 1) failure — including the read itself throwing, and missing key aside — returns
// persistenceOK:false so the caller can suspend further writes rather than silently clobbering
// corrupted, foreign, or inaccessible storage. A clean "no key yet" result is NOT a failure —
// persistence stays enabled so the very first save can happen normally.
//
// Phase B1: supports both version 1 (pre-periods) and version 2 (adds a `periods` container).
// A v1 blob is hydrated exactly as before and migrated in memory with periods:{} — no previous
// month is ever fabricated. A v2 blob's own periods value must already be a plain object; its
// contents are carried through completely untouched (B1 never writes real data into it). Any
// other version is treated exactly like a corrupted/unsupported blob — never silently guessed.
function loadPersistedState(){
  const defaults = () => ({ income:0, buckets:initialBuckets(), goals:initialGoals(), transactions:[], periods:{}, persistenceOK:true });

  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch(e) { return { ...defaults(), persistenceOK:false }; }
  if(raw===null) return defaults();

  let parsed;
  try { parsed = JSON.parse(raw); } catch(e) { return { ...defaults(), persistenceOK:false }; }

  const hasCoreArrays = parsed && typeof parsed==='object'
    && Array.isArray(parsed.buckets) && Array.isArray(parsed.goals) && Array.isArray(parsed.transactions);
  const isV1 = hasCoreArrays && parsed.version===1;
  const isV2 = hasCoreArrays && parsed.version===2 && isPlainObject(parsed.periods);
  if(!isV1 && !isV2) return { ...defaults(), persistenceOK:false };

  const incomeNum = Number(parsed.income);
  const income = (isFiniteNumber(incomeNum) && incomeNum>=0) ? incomeNum : 0;
  const buckets = dedupeById(parsed.buckets.map(hydrateBucket).filter(Boolean));
  const goals = dedupeById(parsed.goals.map(hydrateGoal).filter(Boolean));
  const transactions = dedupeById(parsed.transactions.map(hydrateTransaction).filter(Boolean));
  const periods = isV2 ? parsed.periods : {};

  return {
    income,
    buckets: buckets.length ? buckets : initialBuckets(),
    goals, transactions, periods, persistenceOK:true,
  };
}

// Single centralized write path — the only place localStorage is ever touched. No financial
// mutation handler anywhere writes to storage directly; App's one effect calls this whenever
// income/buckets/goals/transactions/periods change. Returns true on a successful write, false on
// any serialization or storage failure, so the caller can latch persistence off for the session.
// Phase B1: writes schema version 2, which adds `periods` alongside the unchanged current-state
// fields — periods is passed through as-is, never populated or shaped by this function.
function saveState({income, buckets, goals, transactions, periods}){
  try {
    const payload = {
      version: 2,
      income,
      buckets: buckets.map(b => ({
        id:b.id, name:b.name, pct:b.pct, used:b.used, kind:b.kind, color:b.color,
        custom:b.custom, iconKey:iconKeyFor(b.Icon), paceDays:b.paceDays, paceStartDate:b.paceStartDate,
      })),
      goals: goals.map(g => ({
        id:g.id, name:g.name, target:g.target, saved:g.saved, color:g.color,
        iconKey:iconKeyFor(g.Icon), targetDate:g.targetDate, priority:g.priority,
      })),
      transactions,
      periods,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    return true;
  } catch(e) {
    // Quota exceeded, private-browsing restrictions, etc. — app keeps working in memory.
    return false;
  }
}

const ROUTES = ['onboarding','home','plan','transactions','goals','insights','settings'];
function parseHash(){
  const h = window.location.hash.replace(/^#\/?/, '');
  return ROUTES.includes(h) ? h : 'home';
}
function useRoute(){
  const [route, setRoute] = useState(parseHash());
  useEffect(()=>{
    if(!window.location.hash) window.location.hash = '#/home';
    const onHash = () => setRoute(parseHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  return [route, (r)=>{ window.location.hash = '#/' + r; }];
}

function Donut({segments, size=176, thickness=20}){
  const r = (size - thickness) / 2;
  const c = 2 * Math.PI * r;
  const gap = 5; // px of visual separation between segments
  let cursor = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--app-surface-2)" strokeWidth={thickness}/>
      {segments.map((s,i)=>{
        const len = (s.pct/100)*c;
        const drawn = Math.max(len - gap, 0);
        const offset = -cursor;
        cursor += len;
        return (
          <circle key={i} cx={size/2} cy={size/2} r={r} fill="none"
                  stroke={s.color} strokeWidth={thickness} strokeLinecap="round"
                  strokeDasharray={`${drawn} ${c-drawn}`} strokeDashoffset={offset}/>
        );
      })}
    </svg>
  );
}

function BucketRow({bucket, showBar=true}){
  const {name, amount, used, kind, color, Icon} = bucket;
  const remaining = amount - used;
  const remainingProtected = Math.max(0, amount - used);
  // Uncapped — a bucket can legitimately be spent past 100% of its allocation; only the
  // progress BAR WIDTH gets clamped below, never the displayed percentage or peso amounts.
  const spentPct = amount>0 ? Math.round((used/amount)*100) : 0;
  const barWidth = Math.min(100, spentPct);
  const isOverBudget = used > amount;
  const overBudgetAmount = used - amount;
  const isProtect = kind==='protect';
  return (
    <div className="bucket-row">
      <div className="row" style={{gap:'.8rem', alignItems:'flex-start'}}>
        <div className="bucket-icon" style={{background:color}}><Icon size={19}/></div>

            <div className="row" style={{gap:'.35rem'}}>
              <span style={{fontWeight:700, fontSize:'.93rem'}}>{name}</span>
              {isProtect && <LockIcon size={12} className="faint" aria-label="Protected"/>}
            </div>
            <span className="tabular" style={{fontWeight:800, fontSize:'.9rem'}}>{PESO(amount)} allocated</span>
          </div>
          {isProtect ? (
            <div className="row between" style={{marginTop:'.25rem'}}>
              <span className="muted" style={{fontSize:'.78rem'}}>{PESO(remainingProtected)} protected</span>
              {used>0 && <span className="muted tabular" style={{fontSize:'.78rem', fontWeight:600}}>{PESO(used)} used</span>}
            </div>
          ) : (
            <div className="row between" style={{marginTop:'.25rem'}}>
              <span className="tabular" style={{fontSize:'.78rem', color: isOverBudget ? 'var(--status-bad-text)' : 'var(--app-ink-soft)'}}>
                {isOverBudget ? `${PESO(overBudgetAmount)} over budget` : `${PESO(remaining)} remaining`}
              </span>
              <span className="tabular" style={{fontSize:'.78rem', fontWeight:600, color: isOverBudget ? 'var(--status-bad-text)' : 'var(--app-ink-soft)'}}>{spentPct}% spent</span>

          )}

            <div className="progress-track" style={{marginTop:'.55rem'}}>

            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// Resolve a bucket's CURRENT name live (never stored on the record) — so a rename shows up
// retroactively in history, and a deleted bucket falls back safely instead of crashing.
function bucketNameFor(bucketId, buckets){
  const b = buckets.find(x=>x.id===bucketId);
  return b ? b.name : 'Deleted bucket';
}
function incomeSourceLabelFor(sourceId){
  const s = INCOME_SOURCES.find(x=>x.id===sourceId);
  return s ? s.label : sourceId;
}
// Parse the stored 'YYYY-MM-DD' as LOCAL midnight (not UTC) to avoid an off-by-one display date.
function formatTxnDate(dateStr){
  if(!dateStr) return '';
  return new Date(dateStr+'T00:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

/* ============================== pages ============================== */
function HomePage({navigate, income, buckets, transactions, editExpenseTransaction, deleteExpenseTransaction, editIncomeTransaction, deleteIncomeTransaction}){
  const {liveBuckets, allSpent, totalRemaining, deficit, effectiveProtectedRemaining, availableToSpend} = deriveFinancialSummary(buckets, income);
  const segments = liveBuckets.map(b=>({pct:b.pct, color:b.color}));
  const totalPct = liveBuckets.reduce((s,b)=>s+b.pct,0);
  const isOverspent = deficit > 0;
  const hasIncome = income > 0;

  const [editingTxn, setEditingTxn] = useState(null);
  const [formAmount, setFormAmount] = useState('');
  const [formCategory, setFormCategory] = useState('');
  const [formNote, setFormNote] = useState('');
  const [formDate, setFormDate] = useState('');
  const [confirmDeleteOpen, setConfirmDeleteOpen] = useState(false);

  const [editingIncomeTxn, setEditingIncomeTxn] = useState(null);
  const [incomeFormAmount, setIncomeFormAmount] = useState('');
  const [incomeFormSource, setIncomeFormSource] = useState('');
  const [incomeFormDate, setIncomeFormDate] = useState('');
  const [confirmDeleteIncomeOpen, setConfirmDeleteIncomeOpen] = useState(false);

  function openEditIncome(txn){
    setEditingIncomeTxn(txn);
    setIncomeFormAmount(String(txn.amount));
    setIncomeFormSource(txn.source || '');
    setIncomeFormDate(txn.date);
    setConfirmDeleteIncomeOpen(false);
  }
  function closeEditIncome(){
    setEditingIncomeTxn(null);
    setConfirmDeleteIncomeOpen(false);
  }
  const incomeFormAmountNum = toNum(incomeFormAmount);
  const canSaveIncomeEdit = incomeFormAmountNum>0 && !!incomeFormDate;

  function saveEditIncome(e){
    e.preventDefault();
    if(!canSaveIncomeEdit || !editingIncomeTxn) return;
    editIncomeTransaction(editingIncomeTxn.id, {
      amount: incomeFormAmountNum, source: incomeFormSource, date: incomeFormDate,
    });
    setEditingIncomeTxn(null);
  }

  // Delete-impact preview reads the SAVED transaction (editingIncomeTxn), never the unsaved
  // incomeFormAmount/Source/Date draft state, and derives projected numbers from the current
  // App-level income/allSpent — never from summing transaction history.
  const savedIncomeAmount = editingIncomeTxn ? editingIncomeTxn.amount : 0;
  const projectedIncome = Math.max(0, income - savedIncomeAmount);
  const projectedRemaining = projectedIncome - allSpent;
  const projectedDeficit = Math.max(0, -projectedRemaining);
  const incomeDeleteCausesDeficit = projectedDeficit > 0;

  function confirmDeleteIncome(){
    if(!editingIncomeTxn) return;
    deleteIncomeTransaction(editingIncomeTxn.id);
    setConfirmDeleteIncomeOpen(false);
    setEditingIncomeTxn(null);
  }

  function openEditExpense(txn){
    setEditingTxn(txn);
    setFormAmount(String(txn.amount));
    setFormCategory(txn.bucketId);
    setFormNote(txn.note || '');
    setFormDate(txn.date);
    setConfirmDeleteOpen(false);
  }
  function closeEditExpense(){
    setEditingTxn(null);
    setConfirmDeleteOpen(false);
  }
  const formAmountNum = toNum(formAmount);
  const formCategoryValid = buckets.some(b=>b.id===formCategory);
  const canSaveEdit = formAmountNum>0 && formCategoryValid && !!formDate;

  function saveEditExpense(e){
    e.preventDefault();
    if(!canSaveEdit || !editingTxn) return;
    editExpenseTransaction(editingTxn.id, {
      amount: formAmountNum, bucketId: formCategory, note: formNote, date: formDate,
    });
    setEditingTxn(null);
  }
  function confirmDeleteExpense(){
    if(!editingTxn) return;
    deleteExpenseTransaction(editingTxn.id);
    setConfirmDeleteOpen(false);
    setEditingTxn(null);
  }

  return (
    <>
    <div className="app-scroll">
      <TopBar onSettings={()=>navigate('settings')}/>

      <div className="eyebrow">Monthly Income</div>
      <div className="tabular" style={{fontFamily:'var(--font-display)', fontWeight:800, fontSize:'2.2rem', lineHeight:1.1, marginTop:'.15rem'}}>
        {PESO(income)}
      </div>
      <div className="muted" style={{fontSize:'.85rem', marginTop:'.25rem', fontWeight:600}}>{CURRENT_MONTH}</div>

      <div className="card" style={{marginTop:'1.3rem', padding:'1.4rem 1.2rem'}}>
        <div style={{display:'flex', justifyContent:'center', position:'relative'}}>
          <Donut segments={segments}/>
          <div style={{position:'absolute', top:'50%', left:'50%', transform:'translate(-50%,-50%)', textAlign:'center'}}>
            {hasIncome ? (
              <>
                <div style={{fontFamily:'var(--font-display)', fontWeight:800, fontSize:'1.75rem'}}>{totalPct}%</div>
                <div className="muted" style={{fontSize:'.72rem', fontWeight:700, letterSpacing:'.05em', textTransform:'uppercase', marginTop:'.1rem'}}>Allocated</div>
              </>
            ) : (
              <>
                <div style={{fontFamily:'var(--font-display)', fontWeight:800, fontSize:'1.05rem', lineHeight:1.2}}>Set up</div>
                <div className="muted" style={{fontSize:'.68rem', fontWeight:700, letterSpacing:'.04em', textTransform:'uppercase', marginTop:'.15rem'}}>your income</div>
              </>
            )}
          </div>
        </div>
        <div style={{textAlign:'center', fontSize:'.88rem', fontWeight:600, color:'var(--brand)', marginTop:'1rem'}}>
          {hasIncome ? 'Every peso has a purpose.' : 'Add your income in Plan or Settings to activate your plan.'}
        </div>
        <div className="row" style={{flexWrap:'wrap', justifyContent:'center', gap:'.55rem .95rem', marginTop:'1.1rem', paddingTop:'1.1rem', borderTop:'1px solid var(--app-border)'}}>
          {liveBuckets.map(b=>(
            <div key={b.id} className="row" style={{gap:'.4rem'}}>
              <span style={{width:8,height:8,borderRadius:99,background:b.color,display:'inline-block'}}/>
              <span style={{fontSize:'.78rem', fontWeight:600}}>{b.name}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{marginTop:'1.5rem'}}>
        <div className="eyebrow" style={{marginBottom:'.65rem'}}>Money Status</div>
        <div className="card" style={{
          background: isOverspent ? 'var(--status-bad-icon)' : 'linear-gradient(155deg, var(--brand) 0%, var(--brand-strong) 100%)',
          border:'none', boxShadow: isOverspent ? '0 16px 32px -16px rgba(220,38,38,.45)' : '0 16px 32px -16px rgba(14,79,61,.55)', padding:'1.3rem 1.25rem'
        }}>
          <div className="row between" style={{alignItems:'flex-start'}}>
            <div>
              <div style={{color:'rgba(255,255,255,.8)', fontSize:'.76rem', fontWeight:700, letterSpacing:'.05em', textTransform:'uppercase'}}>
                {isOverspent ? 'Overspent' : 'Total Remaining'}
              </div>
              <div className="tabular" style={{color:'#fff', fontFamily:'var(--font-display)', fontWeight:800, fontSize:'2.15rem', marginTop:'.35rem', lineHeight:1.1}}>
                {PESO(isOverspent ? deficit : totalRemaining)}
              </div>
              <div style={{color:'rgba(255,255,255,.75)', fontSize:'.8rem', marginTop:'.3rem'}}>
                of {PESO(income)} income
              </div>
            </div>
            <div className="icon-btn" style={{background:'rgba(255,255,255,.18)', color:'#fff', border:'none', width:36, height:36}}>
              {isOverspent ? <AlertTriangleIcon size={17}/> : <WalletIcon size={17}/>}
            </div>
          </div>
        </div>
        <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'.6rem', marginTop:'.65rem'}}>
          <StatTile label="Available to Spend" value={availableToSpend} Icon={WalletIcon} tint="var(--brand-tint)" ink="var(--brand)"/>
          <StatTile label="Protected" value={effectiveProtectedRemaining} Icon={ShieldCheckIcon} tint="var(--status-good-bg)" ink="var(--status-good-text)"/>
          <StatTile label="Spent" value={allSpent} Icon={ReceiptIcon} tint="var(--app-surface-2)" ink="var(--app-ink-soft)"/>
        </div>
      </div>

      <div className="row between" style={{marginTop:'1.6rem', marginBottom:'.7rem'}}>
        <span className="section-title">Your Money</span>
      </div>
      <div className="card" style={{padding:'1.2rem 1.15rem'}}>
        {liveBuckets.map(b=><BucketRow key={b.id} bucket={b}/>)}
      </div>

      <div className="row between" style={{marginTop:'1.6rem', marginBottom:'.7rem'}}>
        <span className="section-title">Recent Transactions</span>
      </div>
      <div className="card" style={{padding:'1.2rem 1.15rem'}}>
        {transactions.length===0 ? (
          <div className="muted" style={{textAlign:'center', fontSize:'.85rem'}}>No transactions yet.</div>
        ) : (
          transactions.slice(0,5).map((t,i)=>{
            const isExpense = t.type==='expense';
            const title = isExpense ? (t.note || bucketNameFor(t.bucketId, buckets)) : incomeSourceLabelFor(t.source);
            const subtitle = isExpense
              ? `${bucketNameFor(t.bucketId, buckets)} · ${formatTxnDate(t.date)}`
              : `Income · ${formatTxnDate(t.date)}`;
            return (
              <button key={t.id} type="button" onClick={()=> isExpense ? openEditExpense(t) : openEditIncome(t)}
                className="row between" style={{
                  alignItems:'flex-start', marginTop: i?'.75rem':'0', paddingTop: i?'.75rem':'0',
                  borderTop: i?'1px solid var(--app-border)':'none',
                  width:'100%', background:'none', border:'none', textAlign:'left', font:'inherit', color:'inherit',
                  cursor:'pointer',
                }}>
                <div className="row" style={{gap:'.65rem'}}>
                  <div className="icon-btn" style={{
                    width:36, height:36, border:'none',
                    background: isExpense ? 'var(--app-surface-2)' : 'var(--status-good-bg)',
                    color: isExpense ? 'var(--app-ink-soft)' : 'var(--status-good-icon)',
                  }}>
                    {isExpense ? <ArrowDownCircleIcon size={17}/> : <ArrowUpCircleIcon size={17}/>}
                  </div>
                  <div>
                    <div style={{fontWeight:700, fontSize:'.9rem'}}>{title}</div>
                    <div className="muted" style={{fontSize:'.78rem', marginTop:'.1rem'}}>{subtitle}</div>
                  </div>
                </div>
                <span className="tabular" style={{fontWeight:800, fontSize:'.9rem', flexShrink:0, color: isExpense ? 'var(--app-ink)' : 'var(--status-good-text)'}}>
                  {isExpense ? '−' : '+'}{PESO(t.amount)}
                </span>
              </button>
            );
          })
        )}
      </div>
    </div>

    {editingTxn && (
      <div className="modal-backdrop" onClick={closeEditExpense}>
        {confirmDeleteOpen ? (
          <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
            <div style={{width:36, height:4, borderRadius:99, background:'var(--app-border)', margin:'0 auto 1rem'}}/>
            <div className="row" style={{gap:'.6rem'}}>
              <div className="icon-btn" style={{background:'var(--status-bad-bg)', color:'var(--status-bad-icon)', border:'none', width:34, height:34, flexShrink:0}}>
                <TrashIcon size={16}/>
              </div>
              <div style={{fontWeight:800, fontSize:'1rem'}}>Delete this expense?</div>
            </div>
            <div className="muted" style={{fontSize:'.84rem', marginTop:'.9rem', lineHeight:1.5}}>
              This will remove the transaction and reverse its effect on your budget.
            </div>
            <div className="row" style={{gap:'.6rem', marginTop:'1.3rem'}}>
              <button type="button" className="btn-ghost" style={{flex:1}} onClick={()=>setConfirmDeleteOpen(false)}>Keep Transaction</button>
              <button type="button" className="btn-primary" style={{flex:1, background:'var(--status-bad-icon)', boxShadow:'none'}} onClick={confirmDeleteExpense}>Delete Expense</button>
            </div>
          </div>
        ) : (
          <form className="modal-sheet" onClick={e=>e.stopPropagation()} onSubmit={saveEditExpense}>
            <div style={{width:36, height:4, borderRadius:99, background:'var(--app-border)', margin:'0 auto 1rem'}}/>
            <div style={{fontWeight:800, fontSize:'1.05rem', marginBottom:'1.1rem'}}>Edit Expense</div>

            <AmountField id="edit-expense-amount" value={formAmount} onChange={setFormAmount}/>

            <div className="eyebrow" style={{marginTop:'1.1rem', marginBottom:'.4rem'}}>Category</div>
            <div className="row" style={{flexWrap:'wrap', gap:'.5rem'}}>
              {buckets.map(b=>(
                <button type="button" key={b.id} className="chip row" style={{gap:'.32rem'}}
                        aria-pressed={formCategory===b.id} onClick={()=>setFormCategory(b.id)}>
                  {b.name}
                  {b.kind==='protect' && <LockIcon size={11}/>}
                </button>
              ))}
            </div>
            {!formCategoryValid && (
              <div className="muted" style={{fontSize:'.78rem', marginTop:'.6rem', color:'var(--status-warn-text)', lineHeight:1.4}}>
                This transaction&rsquo;s original category no longer exists. Choose a current category before saving.
              </div>
            )}

            <label htmlFor="edit-expense-note" className="eyebrow" style={{display:'block', marginTop:'1.1rem', marginBottom:'.4rem'}}>Note</label>
            <input id="edit-expense-note" value={formNote} onChange={e=>setFormNote(e.target.value)} placeholder="What was this for?" style={{
              width:'100%', padding:'.8rem .9rem', borderRadius:'var(--r-md)', border:'1px solid var(--app-border)',
              background:'var(--app-surface)', fontSize:'.9rem', color:'var(--app-ink)'
            }}/>

            <label htmlFor="edit-expense-date" className="eyebrow" style={{display:'block', marginTop:'1.1rem', marginBottom:'.4rem'}}>Date</label>
            <div className="row" style={{gap:'.6rem', border:'1px solid var(--app-border)', background:'var(--app-surface)', borderRadius:'var(--r-md)', padding:'.7rem .9rem'}}>
              <CalendarIcon size={18} className="muted"/>
              <input id="edit-expense-date" type="date" value={formDate} onChange={e=>setFormDate(e.target.value)} style={{
                border:'none', outline:'none', background:'transparent', fontSize:'.88rem', color:'var(--app-ink)', flex:1
              }}/>
            </div>

            <button type="button" onClick={()=>setConfirmDeleteOpen(true)} style={{
              display:'block', width:'100%', textAlign:'center', background:'none', border:'none',
              color:'var(--status-bad-text)', fontWeight:700, fontSize:'.85rem', marginTop:'1.2rem', padding:'.3rem'
            }}>
              Delete Transaction
            </button>

            <div className="row" style={{gap:'.6rem', marginTop:'.9rem'}}>
              <button type="button" className="btn-ghost" style={{flex:1}} onClick={closeEditExpense}>Cancel</button>
              <button type="submit" className="btn-primary" style={{flex:1.5, opacity: canSaveEdit ? 1 : .5}} disabled={!canSaveEdit}>Save Changes</button>
            </div>
          </form>
        )}
      </div>
    )}

    {editingIncomeTxn && (
      <div className="modal-backdrop" onClick={closeEditIncome}>
        {confirmDeleteIncomeOpen ? (
          <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
            <div style={{width:36, height:4, borderRadius:99, background:'var(--app-border)', margin:'0 auto 1rem'}}/>
            <div className="row" style={{gap:'.6rem'}}>
              <div className="icon-btn" style={{background:'var(--status-bad-bg)', color:'var(--status-bad-icon)', border:'none', width:34, height:34, flexShrink:0}}>
                <TrashIcon size={16}/>
              </div>
              <div style={{fontWeight:800, fontSize:'1rem'}}>Delete this income?</div>
            </div>
            {incomeDeleteCausesDeficit ? (
              <div className="muted" style={{fontSize:'.84rem', marginTop:'.9rem', lineHeight:1.5}}>
                Deleting this {PESO(savedIncomeAmount)} income will leave your budget {PESO(projectedDeficit)} overspent.
                Your existing expenses will not be changed.
              </div>
            ) : (
              <div className="muted" style={{fontSize:'.84rem', marginTop:'.9rem', lineHeight:1.5}}>
                This will remove the transaction and subtract {PESO(savedIncomeAmount)} from your total income.
              </div>
            )}
            <div className="row" style={{gap:'.6rem', marginTop:'1.3rem'}}>
              <button type="button" className="btn-ghost" style={{flex:1}} onClick={()=>setConfirmDeleteIncomeOpen(false)}>Keep Transaction</button>
              <button type="button" className="btn-primary" style={{flex:1, background:'var(--status-bad-icon)', boxShadow:'none'}} onClick={confirmDeleteIncome}>Delete Income</button>
            </div>
          </div>
        ) : (
        <form className="modal-sheet" onClick={e=>e.stopPropagation()} onSubmit={saveEditIncome}>
          <div style={{width:36, height:4, borderRadius:99, background:'var(--app-border)', margin:'0 auto 1rem'}}/>
          <div style={{fontWeight:800, fontSize:'1.05rem', marginBottom:'1.1rem'}}>Edit Income</div>

          <AmountField id="edit-income-amount" value={incomeFormAmount} onChange={setIncomeFormAmount}/>

          <div className="eyebrow" style={{marginTop:'1.1rem', marginBottom:'.4rem'}}>Income Source</div>
          <div className="row" style={{flexWrap:'wrap', gap:'.5rem'}}>
            {INCOME_SOURCES.map(s=>(
              <button type="button" key={s.id} className="chip" aria-pressed={incomeFormSource===s.id} onClick={()=>setIncomeFormSource(s.id)}>
                {s.label}
              </button>
            ))}
          </div>

          <label htmlFor="edit-income-date" className="eyebrow" style={{display:'block', marginTop:'1.1rem', marginBottom:'.4rem'}}>Date</label>
          <div className="row" style={{gap:'.6rem', border:'1px solid var(--app-border)', background:'var(--app-surface)', borderRadius:'var(--r-md)', padding:'.7rem .9rem'}}>
            <CalendarIcon size={18} className="muted"/>
            <input id="edit-income-date" type="date" value={incomeFormDate} onChange={e=>setIncomeFormDate(e.target.value)} style={{
              border:'none', outline:'none', background:'transparent', fontSize:'.88rem', color:'var(--app-ink)', flex:1
            }}/>
          </div>

          <button type="button" onClick={()=>setConfirmDeleteIncomeOpen(true)} style={{
            display:'block', width:'100%', textAlign:'center', background:'none', border:'none',
            color:'var(--status-bad-text)', fontWeight:700, fontSize:'.85rem', marginTop:'1.2rem', padding:'.3rem'
          }}>
            Delete Transaction
          </button>

          <div className="row" style={{gap:'.6rem', marginTop:'.9rem'}}>
            <button type="button" className="btn-ghost" style={{flex:1}} onClick={closeEditIncome}>Cancel</button>
            <button type="submit" className="btn-primary" style={{flex:1.5, opacity: canSaveIncomeEdit ? 1 : .5}} disabled={!canSaveIncomeEdit}>Save Changes</button>
          </div>
        </form>
        )}
      </div>
    )}
    </>
  );
}

function StatTile({label, value, Icon, tint, ink}){
  return (
    <div className="card" style={{padding:'.85rem .8rem'}}>
      <div className="icon-btn" style={{background:tint, color:ink, border:'none', width:30, height:30, marginBottom:'.5rem'}}>
        <Icon size={15}/>
      </div>
      <div className="tabular" style={{fontWeight:800, fontSize:'.98rem'}}>{PESO(value)}</div>
      <div className="muted" style={{fontSize:'.7rem', marginTop:'.1rem'}}>{label}</div>
    </div>
  );
}

const PLAN_CUSTOM_PALETTE = ['#7c5cff','#0891b2','#d6455d','#7a8f2c','#b8560f'];
const clampPct = n => Math.min(100, Math.max(0, n));

function PlanPage({buckets, setBuckets, income}){
  const [modalOpen, setModalOpen] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [formName, setFormName] = useState('');
  const [formPct, setFormPct] = useState('5');
  const [formProtected, setFormProtected] = useState(false);

  // Budget Pace configuration — a separate, dedicated modal from Add/Edit Bucket above, shared
  // by BOTH default and custom spend buckets so there is exactly one pace configuration flow.
  const [paceModalOpen, setPaceModalOpen] = useState(false);
  const [paceBucketId, setPaceBucketId] = useState(null);
  const [paceFormDays, setPaceFormDays] = useState('');
  const [paceError, setPaceError] = useState('');
  const [paceConfirmView, setPaceConfirmView] = useState(null); // null | 'restart' | 'remove'
  const paceBucket = buckets.find(b=>b.id===paceBucketId) || null; // always read LIVE, never a stale snapshot
  const paceHasExisting = !!paceBucket && (paceBucket.paceDays!=null || paceBucket.paceStartDate!=null);

  function openPaceModal(bucket){
    setPaceBucketId(bucket.id);
    setPaceFormDays(bucket.paceDays!=null ? String(bucket.paceDays) : '');
    setPaceError('');
    setPaceConfirmView(null);
    setPaceModalOpen(true);
  }
  function closePaceModal(){
    setPaceModalOpen(false);
    setPaceBucketId(null);
    setPaceError('');
    setPaceConfirmView(null);
  }
  function validatePaceDays(raw){
    const trimmed = raw.trim();
    if(trimmed==='' || !/^\d+$/.test(trimmed)) return { ok:false, message:'Enter a whole number from 1 to 365.' };
    const n = parseInt(trimmed, 10);
    if(n<1 || n>365) return { ok:false, message:'Enter a whole number from 1 to 365.' };
    return { ok:true, value:n };
  }
  function saveBudgetPace(e){
    e.preventDefault();
    const result = validatePaceDays(paceFormDays);
    if(!result.ok){ setPaceError(result.message); return; }
    const targetId = paceBucketId;
    // Only a bucket with NO existing config gets a fresh start date — editing an existing pace's
    // duration must keep its original paceStartDate (extend/shorten, never silently restart).
    const isNewPace = !paceHasExisting;
    setBuckets(bs => bs.map(b => b.id===targetId ? {
      ...b,
      paceDays: result.value,
      paceStartDate: isNewPace ? paceLocalDateStr(new Date()) : b.paceStartDate,
    } : b));
    closePaceModal();
  }
  function confirmRestartPace(){
    const targetId = paceBucketId;
    setBuckets(bs => bs.map(b => b.id===targetId ? { ...b, paceStartDate: paceLocalDateStr(new Date()) } : b));
    closePaceModal();
  }
  function confirmRemovePace(){
    const targetId = paceBucketId;
    setBuckets(bs => bs.map(b => b.id===targetId ? { ...b, paceDays:null, paceStartDate:null } : b));
    closePaceModal();
  }

  // Budget Pace display — derived fresh every render, never stored. `paceToday` is computed once
  // per render via the approved local-date helper (never toISOString) and passed explicitly into
  // deriveBudgetPace below, per Phase 1's testable/deterministic design.
  const paceToday = paceLocalDateStr(new Date());
  // Read-only use of the existing shared financial summary, purely for the overall-shortage
  // warning below — never modified, never used to cap/redistribute any category's own pace.
  const financialSummary = deriveFinancialSummary(buckets, income);

  const totalPct = buckets.reduce((s,b)=>s+Number(b.pct||0),0);
  const totalAmount = buckets.reduce((s,b)=>s+bucketAmountFor(income,b.pct),0);
  const diff = totalPct - 100;
  const diffAmount = bucketAmountFor(income, Math.abs(diff));
  const status = diff===0 ? 'ok' : diff<0 ? 'under' : 'over';
  const statusTone = {
    ok:   {ink:'var(--status-good-text)', icon:'var(--status-good-icon)', bg:'var(--status-good-bg)', Icon:CheckCircleIcon},
    under:{ink:'var(--status-warn-text)', icon:'var(--status-warn-icon)', bg:'var(--status-warn-bg)', Icon:AlertTriangleIcon},
    over: {ink:'var(--status-bad-text)',  icon:'var(--status-bad-icon)',  bg:'var(--status-bad-bg)',  Icon:AlertTriangleIcon},
  }[status];

  function adjustPct(id, delta){
    setBuckets(bs=>bs.map(b=> b.id===id ? {...b, pct:clampPct(Number(b.pct)+delta)} : b));
  }
  function setPctDirect(id, raw){
    const digits = raw.replace(/[^0-9]/g,'');
    const n = digits==='' ? 0 : clampPct(parseInt(digits,10));
    setBuckets(bs=>bs.map(b=> b.id===id ? {...b, pct:n} : b));
  }
  function removeBucket(id){
    setBuckets(bs=>bs.filter(b=>b.id!==id));
  }
  function openModal(){
    setEditingId(null);
    setFormName(''); setFormPct('5'); setFormProtected(false); setModalOpen(true);
  }
  function openEditModal(bucket){
    setEditingId(bucket.id);
    setFormName(bucket.name);
    setModalOpen(true);
  }
  function closeModal(){
    setModalOpen(false);
    setEditingId(null);
  }
  function submitAdd(e){
    e.preventDefault();
    if(editingId){
      setBuckets(bs=>bs.map(b=> b.id===editingId ? {...b, name: formName.trim() || b.name} : b));
      closeModal();
      return;
    }
    const name = formName.trim() || 'New Bucket';
    const pct = clampPct(parseInt(formPct,10) || 0);
    const color = PLAN_CUSTOM_PALETTE[buckets.filter(b=>b.custom).length % PLAN_CUSTOM_PALETTE.length];
    setBuckets(bs=>[...bs, {
      id:'custom-'+Date.now(), name, pct, used:0, kind: formProtected ? 'protect' : 'spend',
      color, Icon:TagIcon, custom:true, paceDays:null, paceStartDate:null,
    }]);
    closeModal();
  }

  return (
    <>
    <div className="app-scroll">
      <TopBar/>
      <div className="page-head">
        <div className="page-title">Your Plan</div>
        <div className="page-sub">Divide 100% of your income into buckets</div>
      </div>

      <div className="card" style={{textAlign:'center', padding:'1.5rem 1.3rem'}}>
        <div className="eyebrow" style={{letterSpacing:'.08em'}}>Your Money Plan</div>
        <div className="row" style={{justifyContent:'center', gap:'2rem', marginTop:'1rem'}}>
          <div>
            <div className="tabular" style={{fontFamily:'var(--font-display)', fontWeight:800, fontSize:'1.6rem'}}>{PESO(income)}</div>
            <div className="muted" style={{fontSize:'.72rem', marginTop:'.15rem'}}>Monthly Income</div>
          </div>
          <div style={{width:1, background:'var(--app-border)'}}/>
          <div>
            <div className="tabular" style={{fontFamily:'var(--font-display)', fontWeight:800, fontSize:'1.6rem', color:statusTone.ink}}>{totalPct}%</div>
            <div className="muted" style={{fontSize:'.72rem', marginTop:'.15rem'}}>Allocated</div>
          </div>
        </div>

        <div style={{marginTop:'1.15rem', paddingTop:'1.15rem', borderTop:'1px solid var(--app-border)'}}>
          {status==='ok' ? (
            <>
              <div className="row" style={{justifyContent:'center', gap:'.4rem'}}>
                <statusTone.Icon size={16} style={{color:statusTone.icon}}/>
                <span style={{fontWeight:800, fontSize:'.92rem', color:statusTone.ink}}>100% Allocated</span>
              </div>
              <div style={{fontSize:'.85rem', color:statusTone.ink, marginTop:'.35rem'}}>&ldquo;Every peso has a purpose.&rdquo;</div>
            </>
          ) : (
            <>
              <div className="row" style={{justifyContent:'center', gap:'.4rem'}}>
                <statusTone.Icon size={16} style={{color:statusTone.icon}}/>
                <span style={{fontWeight:800, fontSize:'.92rem', color:statusTone.ink}}>{totalPct}% Allocated</span>
              </div>
              <div style={{fontWeight:700, fontSize:'.85rem', color:statusTone.ink, marginTop:'.4rem'}}>
                {status==='under' ? `${Math.abs(diff)}% Unassigned` : `${diff}% Overallocated`}
              </div>
              <div style={{fontSize:'.82rem', color:statusTone.ink, marginTop:'.15rem'}}>
                {status==='under'
                  ? `${PESO(diffAmount)} still needs a purpose.`
                  : `Reduce your allocations by ${PESO(diffAmount)}.`}
              </div>
            </>
          )}
        </div>
      </div>

      <div className="row between" style={{marginTop:'1.4rem', marginBottom:'.7rem'}}>
        <span className="section-title">Allocation</span>
        <span className="faint" style={{fontSize:'.76rem'}}>Tap +/&minus; or type a number</span>
      </div>

      <div>
        {buckets.map(b=>{
          const amount = bucketAmountFor(income, b.pct);
          // Pace is only meaningful for spend buckets; deriveBudgetPace itself safely returns
          // 'inactive' for an unconfigured bucket, so no separate "has config" gate is needed here.
          const pace = b.kind==='spend' ? deriveBudgetPace(amount, b.used, b.paceDays, b.paceStartDate, paceToday) : null;
          // categoryRemaining is null for inactive/invalid pace, so this naturally excludes those
          // states (null>0 is false) without needing to enumerate every status explicitly.
          const showShortageWarning = !!pace && pace.categoryRemaining>0 && financialSummary.availableToSpend < pace.categoryRemaining;
          return (
            <div key={b.id} className="plan-row">
              <div className="row between" style={{alignItems:'flex-start'}}>
                <div className="row" style={{gap:'.65rem'}}>
                  <div className="bucket-icon" style={{background:b.color, width:38, height:38}}><b.Icon size={17}/></div>
                  <div>
                    <div className="row" style={{gap:'.35rem'}}>
                      <span style={{fontWeight:700, fontSize:'.92rem'}}>{b.name}</span>
                    </div>
                    {b.kind==='protect' && (
                      <div className="row" style={{gap:'.25rem', marginTop:'.1rem'}}>
                        <LockIcon size={11} className="faint"/>

                      </div>
                    )}
                  </div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div className="tabular" style={{fontWeight:800, fontSize:'.94rem'}}>{PESO(amount)}</div>

              <div className="row between" style={{marginTop:'.85rem'}}>
                <div className="stepper">
                  <button type="button" className="stepper-btn" aria-label={`Decrease ${b.name} percentage`} onClick={()=>adjustPct(b.id,-5)}>

                )}
              </div>

              {pace && pace.status!=='inactive' && (
                <div style={{marginTop:'.65rem', paddingTop:'.65rem', borderTop:'1px solid var(--app-border)'}}>
                  {pace.status==='active' && (
                    <>
                      <div className="muted" style={{fontSize:'.78rem', fontWeight:600}}>
                        {pace.daysRemaining===1 ? '1 day remaining' : `${pace.daysRemaining} days remaining`}
                      </div>
                      <div className="row between" style={{marginTop:'.3rem', alignItems:'baseline'}}>
                        <span className="muted" style={{fontSize:'.78rem'}}>Suggested daily limit</span>
                        <span className="tabular" style={{fontWeight:800, fontSize:'.9rem', color:'var(--brand)'}}>
                          {pace.suggestedDaily>0 ? `${PESO(pace.suggestedDaily)}/day` : 'Less than ₱1/day left'}
                        </span>
                      </div>
                      <div className="faint" style={{fontSize:'.72rem', marginTop:'.25rem'}}>
                        Based on your remaining {b.name} budget.
                      </div>
                    </>
